SCREENS.plano = function(){
  return DataStore.listPlanItems(STATE.currentUserId).then(items => {
    const grupos = {};
    items.forEach(it => { (grupos[it.grupoId] = grupos[it.grupoId]||[]).push(it); });
    const gruposArr = Object.values(grupos).sort((a,b)=> (a[0].data+a[0].horario).localeCompare(b[0].data+b[0].horario));

    const rows = gruposArr.length ? gruposArr.map(grupo => {
      const conteudo = grupo.find(g=>g.tipo==="conteudo");
      const questoes = grupo.find(g=>g.tipo==="questoes");
      const ref = conteudo || questoes;
      return '<div class="card tight mt12">'
        + '<div class="flex-between"><div>'
        +   '<strong>'+esc(nameOf(STATE.cache.subjects, ref.subjectId))+'</strong> — '+esc(nameOf(STATE.cache.temas, ref.temaId))
        +   '<div class="text-soft" style="font-size:12px;margin-top:2px;">'+esc(nameOf(STATE.cache.parts, ref.partId))+' · '+esc(nameOf(STATE.cache.subtemas, ref.subtemaId))+' · '+fmtDateBR(ref.data)+(ref.fontePlataforma?' · '+esc(ref.fontePlataforma):'')+'</div>'
        + '</div><button class="btn btn-ghost btn-sm" data-action="deletePlanGroup" data-grupo="'+ref.grupoId+'">'+ic("trash",13)+'</button></div>'
        + '<div class="grid grid-2 mt12">'
        +   planBlockHTML(conteudo, questoes)
        +   planBlockHTML(questoes, conteudo)
        + '</div>'
      + '</div>';
    }).join("") : '<div class="empty"><div class="ic">'+ic("plano",22)+'</div><p>Nenhuma sessão planejada ainda.</p></div>';

    return ''
    + '<div class="page-head flex-between"><div><span class="eyebrow">Planejamento</span><h1>Plano de Estudos</h1><p class="desc">Regra fixa por matéria: '+fmtMin(CONFIG.DURACAO_CONTEUDO_MIN)+' de conteúdo + '+fmtMin(CONFIG.DURACAO_QUESTOES_MIN)+' de questões do mesmo tema = 2h.</p></div>'
    +   '<button class="btn btn-primary" data-action="openNewPlan">'+ic("plus",14)+' Nova sessão</button></div>'
    + rows;
  });
};
function planBlockHTML(item, irmao){
  if(!item) return '<div class="card tight" style="background:var(--surface-alt);border-style:dashed;"><span class="text-soft" style="font-size:12.5px;">Bloco não criado</span></div>';
  const realizada = item.duracaoRealizadaMin!=null ? fmtMin(item.duracaoRealizadaMin) : "—";
  const podeEncerrar = item.status!=="concluido" && item.status!=="cancelado";
  const bloqueadoPorConteudo = item.tipo==="questoes" && irmao && irmao.tipo==="conteudo" && irmao.status!=="concluido";
  return '<div class="card tight" style="background:var(--surface-alt);">'
    + '<div class="flex-between"><span class="badge '+(item.tipo==="conteudo"?"blue":"gold")+'">'+(item.tipo==="conteudo"?"Conteúdo · "+fmtMin(item.duracaoPlanejadaMin):"Questões · "+fmtMin(item.duracaoPlanejadaMin))+'</span>'+badgeStatus(item.status)+'</div>'
    + '<div class="text-soft" style="font-size:12px;margin:6px 0;">'+item.horario+' · realizado: '+realizada+(item.dataOriginal?' · reagendada de '+fmtDateBR(item.dataOriginal):'')+'</div>'
    + (bloqueadoPorConteudo ? '<div class="hint">Disponível assim que o bloco de conteúdo for concluído.</div>' : '<div class="flex-gap">'
    + (item.status==="planejado" ? '<button class="btn btn-ghost btn-sm" data-action="startPlanBlock" data-id="'+item.id+'">Iniciar</button>' : "")
    + (item.status==="iniciado" ? '<button class="btn btn-primary btn-sm" data-action="finishPlanBlock" data-id="'+item.id+'">Concluir</button>' : "")
    + (item.status==="iniciado" ? '<button class="btn btn-ghost btn-sm" data-action="markPlanStatus" data-id="'+item.id+'" data-status="pausado">Pausar</button>' : "")
    + (item.status==="pausado" ? '<button class="btn btn-primary btn-sm" data-action="markPlanStatus" data-id="'+item.id+'" data-status="iniciado">Retomar</button>' : "")
    + (item.tipo==="questoes" && item.status!=="concluido" && !bloqueadoPorConteudo ? '<button class="btn btn-primary btn-sm" data-action="iniciarQuestoesDoPlano" data-id="'+item.id+'">Ir para as questões</button>' : "")
    + (podeEncerrar ? '<button class="btn btn-ghost btn-sm" data-action="markPlanStatus" data-id="'+item.id+'" data-status="perdido">Marcar como perdida</button>' : "")
    + (podeEncerrar ? '<button class="btn btn-ghost btn-sm" data-action="openReschedulePlan" data-id="'+item.id+'">Reagendar</button>' : "")
    + (podeEncerrar ? '<button class="btn btn-ghost btn-sm" data-action="markPlanStatus" data-id="'+item.id+'" data-status="cancelado">Cancelar</button>' : "")
    + '</div>')
    + '</div>';
}

Actions.submitNewPlan = function(form){

  const subjectId = fd.get("subjectId");
  if(!subjectId){ alert("Cadastre ao menos uma matéria em Configurações antes de planejar."); return; }

    data: fd.get("data"), horario: fd.get("horario"), observacao: fd.get("observacao"), fontePlataforma: fd.get("fontePlataforma")

Actions.deletePlanGroup = function(el){
  if(!confirm("Excluir esta sessão planejada (conteúdo + questões)?")) return;
  DataStore.listPlanItems(STATE.currentUserId).then(items => {
    const toRemove = items.filter(i=>i.grupoId===el.dataset.grupo);

Actions.startPlanBlock = function(el){

};
Actions.finishPlanBlock = function(el){
  DataStore.listPlanItems(STATE.currentUserId).then(items => {
    const item = items.find(i=>i.id===el.dataset.id);
    openModal(''
      + '<button class="modal-close" data-action="closeModal">'+ic("close",16)+'</button>'
      + '<h3>Concluir bloco</h3>'
      + '<form data-form="submitFinishPlan"><input type="hidden" name="id" value="'+item.id+'">'
      +   '<div class="field"><label>Duração realizada (minutos)</label><input type="number" name="min" min="1" value="'+item.duracaoPlanejadaMin+'" required></div>'
      +   (item.tipo==="questoes" ? '<p class="hint">Depois de concluir, você pode iniciar a sessão de questões cronometrada.</p>' : "")
      +   '<button class="btn btn-primary btn-block" type="submit">Marcar como concluída</button>'
      + '</form>'
    );
  });
};
Actions.submitFinishPlan = function(form){
  const fd = new FormData(form);
  const id = fd.get("id");
  DataStore.listPlanItems(STATE.currentUserId).then(items => {
    const item = items.find(i=>i.id===id);
    DataStore.updatePlanItem(id, { status:"concluido", duracaoRealizadaMin: Number(fd.get("min")) }).then(() => {
      // Toda sessão de CONTEÚDO concluída gera (ou apenas garante) a revisão daquele
      // conteúdo no motor unificado — mesmo que a usuária ainda não tenha feito nenhuma
      // questão. Não duplica: getOrCreateRevisao só cria se ainda não existir.
      const registrarRevisao = (item && item.tipo === "conteudo")
        ? DataStore.getOrCreateRevisao({ userId: STATE.currentUserId, subjectId:item.subjectId, partId:item.partId, temaId:item.temaId, subtemaId:item.subtemaId, grupoId:item.grupoId })
        : Promise.resolve(null);
      registrarRevisao.then(() => { modalRoot.innerHTML = ""; renderScreen(); });
    });
  });
};
// "Ir para as questões" no Plano — abre a sessão de questões cronometrada já filtrada
// pelo mesmo usuário/matéria/tema/subtema do bloco de conteúdo estudado.
Actions.iniciarQuestoesDoPlano = function(el){
  DataStore.listPlanItems(STATE.currentUserId).then(items => {
    const item = items.find(i=>i.id===el.dataset.id);
    if(!item){ return; }
    DataStore.listQuestions({ subjectId:item.subjectId, temaId:item.temaId, subtemaId:item.subtemaId, apenasAtivas:true }).then(bank => {
      let pool = bank;
      if(!pool.length){
        DataStore.listQuestions({ subjectId:item.subjectId, temaId:item.temaId, apenasAtivas:true }).then(fallback => {
          if(!fallback.length){ alert("Não há questões ativas cadastradas para este tema ainda."); return; }
          beginSession(item.subjectId, item.partId, item.temaId, item.subtemaId, fallback, null, item.id);
        });
        return;
      }
      beginSession(item.subjectId, item.partId, item.temaId, item.subtemaId, pool, null, item.id);
    });
  });
};
Actions.markPlanStatus = function(el){
  DataStore.updatePlanItem(el.dataset.id, { status: el.dataset.status }).then(renderScreen);
};

};

   TELA — QUESTÕES (sessão baseada em TEMPO, independente da quantidade)

SCREENS.questoes = function(){
  if(STATE.activeQuestionSession && !STATE.activeQuestionSession.finished){
    return renderActiveSession();
  }
  if(STATE.activeQuestionSession && STATE.activeQuestionSession.finished){
    return renderSessionSummary();
  }
  return Promise.all([DataStore.listAnswers({userId:STATE.currentUserId}), DataStore.listQuestions()]).then(([answers, allQuestions]) => {
    const historico = answers.slice(-8).reverse();

    if(!STATE.cache.subjects.length){
      return ''
      + '<div class="page-head"><span class="eyebrow">Prática</span><h1>Sessão de Questões</h1></div>'
      + '<div class="empty"><div class="ic">'+ic("questoes",22)+'</div><p>Ainda não há matérias/temas cadastrados.</p>'
      + '<p class="hint mt8">Cadastre a estrutura de matéria → parte → tema → subtema em Configurações antes de iniciar uma sessão de questões.</p>'
      + '<button class="btn btn-primary btn-sm mt12" data-action="navTo" data-screen="config">Ir para Configurações</button></div>';
    }
    if(!allQuestions.length){
      return ''
      + '<div class="page-head"><span class="eyebrow">Prática</span><h1>Sessão de Questões</h1></div>'
      + '<div class="empty"><div class="ic">'+ic("questoes",22)+'</div><p>Ainda não há questões cadastradas no sistema.</p>'
      + '<p class="hint mt8">Assim que houver questões cadastradas para algum tema, elas aparecerão aqui para a sessão de '+CONFIG.DURACAO_QUESTOES_MIN+' minutos.</p></div>';
    }

    return ''
    + '<div class="page-head"><span class="eyebrow">Prática</span><h1>Sessão de Questões</h1><p class="desc">A sessão dura '+CONFIG.DURACAO_QUESTOES_MIN+' minutos corridos — o número de questões respondidas varia, o tempo não.</p></div>'
    + '<div class="card">'
    +   '<h3 class="mb8">Escolha o conteúdo da sessão</h3>'
    +   '<form data-form="startQuestionSession">'
    +     cascadeSelectsHTML("qsession")
    +     '<button class="btn btn-primary btn-block mt8" type="submit">'+ic("clock",14)+' Iniciar sessão de '+CONFIG.DURACAO_QUESTOES_MIN+' minutos</button>'
    +   '</form>'
    + '</div>'
    + (historico.length ? '<div class="card mt16"><h3 class="mb8">Últimas respostas</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Tema</th><th>Resultado</th><th>Tempo</th></tr></thead><tbody>'
      + historico.map(a => '<tr><td>'+fmtDateBR(a.data)+'</td><td>'+esc(nameOf(STATE.cache.temas,a.temaId))+'</td><td>'+(a.correta?'<span class="badge green">Acerto</span>':'<span class="badge red">Erro</span>')+'</td><td>'+a.tempoSegundos+'s</td></tr>').join("")
      + '</tbody></table></div></div>' : "");
  });
};

Actions.startQuestionSession = function(form){
  const fd = new FormData(form);
  const subjectId = fd.get("subjectId"), temaId = fd.get("temaId"), subtemaId = fd.get("subtemaId"), partId = fd.get("partId");
  if(!subjectId){ alert("Cadastre uma matéria em Configurações antes de iniciar uma sessão."); return; }
  DataStore.listQuestions({ subjectId, temaId, subtemaId, apenasAtivas:true }).then(bank => {
    let pool = bank;
    if(!pool.length){
      DataStore.listQuestions({ subjectId, temaId, apenasAtivas:true }).then(fallback => {
        if(!fallback.length){ alert("Não há questões ativas cadastradas para este tema ainda."); return; }
        beginSession(subjectId, partId, temaId, subtemaId, fallback);
      });
      return;
    }
    beginSession(subjectId, partId, temaId, subtemaId, pool);
  });
};
// duvidaId (opcional): quando a sessão é iniciada a partir do botão "Fazer
// questões sobre este assunto" dentro de uma dúvida da Central de Dúvidas.
function beginSession(subjectId, partId, temaId, subtemaId, pool, duvidaId, planItemId){
  DataStore.createQuestionSession({ userId: STATE.currentUserId, subjectId, partId, temaId, subtemaId, duracaoMin: CONFIG.DURACAO_QUESTOES_MIN, duvidaId: duvidaId||null }).then(session => {
    STATE.activeQuestionSession = {
      id: session.id, subjectId, partId, temaId, subtemaId, duvidaId: duvidaId||null, planItemId: planItemId||null,
      endsAt: Date.now() + CONFIG.DURACAO_QUESTOES_MIN*60*1000,
      pool: pool, poolIdx: 0,
      respondidas: 0, acertos: 0,
      current: null, answeredCurrent: false, pendingErrorAnswerId: null, pendingDifficultyAnswerId: null,
      finished: false
    };
    STATE.screen = "questoes";
    renderScreen();
  });
}
Actions.iniciarQuestoesDaDuvida = function(el){
  const duvidaId = el.dataset.id;
  DataStore.getDuvida(duvidaId).then(duv => {
    if(!duv || !duv.subjectId){ alert("Esta dúvida ainda não está classificada com uma matéria — classifique-a antes de gerar questões sobre o assunto."); return; }
    DataStore.listQuestions({ subjectId:duv.subjectId, temaId:duv.temaId, subtemaId:duv.subtemaId, apenasAtivas:true }).then(bank => {
      let pool = bank;
      if(!pool.length){
        DataStore.listQuestions({ subjectId:duv.subjectId, temaId:duv.temaId, apenasAtivas:true }).then(fallback => {
          if(!fallback.length){ alert("Não há questões ativas cadastradas para este tema ainda."); return; }
          beginSession(duv.subjectId, duv.partId, duv.temaId, duv.subtemaId, fallback, duvidaId);
        });
        return;
      }
      beginSession(duv.subjectId, duv.partId, duv.temaId, duv.subtemaId, pool, duvidaId);
    });
  });
};
function nextPoolQuestion(sess){
  const q = sess.pool[sess.poolIdx % sess.pool.length];
  sess.poolIdx++;
  return q;
}
function renderActiveSession(){
  const sess = STATE.activeQuestionSession;
  if(!sess.current) sess.current = nextPoolQuestion(sess);
  const q = sess.current;
  const answered = sess.answeredCurrent;
  const opcoesHtml = CONFIG.RESPOSTAS_CERTO_ERRADO.map(opt => {
    let cls = "alt";
    if(answered){
      if(opt===q.respostaCorreta) cls += " correct";
      else if(opt===sess.lastChosen) cls += " wrong";
    }
    return '<div class="'+cls+'" '+(answered?'':'data-action="pickAlt" data-alt="'+opt+'"')+'>'
      + '<span class="letter">'+(opt==="CERTO"?"C":"E")+'</span><span>'+opt+'</span></div>';
  }).join("");

  let resultBlock = "";
  if(answered){
    const correta = sess.lastChosen === q.respostaCorreta;
    resultBlock = '<div class="card tight mt12" style="background:'+(correta?'var(--primary-soft)':'var(--danger-soft)')+';">'
      + '<strong>'+(correta?'✓ Resposta correta':'✕ Resposta incorreta')+'</strong>'
      + '<p style="font-size:13px;margin-top:6px;">'+esc(q.explicacao)+'</p>'
      + (!correta ? '<button class="btn btn-ghost btn-sm mt8" data-action="criarDuvidaDeQuestaoErrada" data-answer-id="'+sess.lastAnswerId+'">Tenho dúvida sobre esta questão</button>' : "")
      + '</div>';
    if(!correta && sess.pendingErrorAnswerId){
      resultBlock += ''
      + '<div class="card tight mt12">'
      +   '<h3 class="mb8" style="font-size:14px;">Por que você errou?</h3>'
      +   '<form data-form="submitErrorDetails">'
      +     '<input type="hidden" name="answerId" value="'+sess.pendingErrorAnswerId+'">'
      +     '<div class="field"><label>Motivo do erro</label><select name="motivoErro" required><option value="">Selecione…</option>'+CONFIG.MOTIVOS_ERRO.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join("")+'</select></div>'
      +     '<div class="field"><label>Minha dúvida (opcional)</label><textarea name="duvida" placeholder="Descreva o que não ficou claro"></textarea></div>'
      +     '<div class="field"><label>Observação (opcional)</label><textarea name="observacao"></textarea></div>'
      +     '<button class="btn btn-primary btn-block" type="submit">Salvar e continuar</button>'
      +   '</form>'
      + '</div>';
    } else if(sess.pendingDifficultyAnswerId){
      resultBlock += ''
      + '<div class="card tight mt12">'
      +   '<h3 class="mb8" style="font-size:14px;">Como foi essa questão para você?</h3>'
      +   '<div class="chip-row">'+CONFIG.DIFICULDADE_OPCOES.map(op=>'<button class="chip" data-action="pickDifficulty" data-nivel="'+esc(op)+'">'+esc(op)+'</button>').join("")+'</div>'
      +   '<button class="btn btn-ghost btn-sm mt8" data-action="skipDifficulty">Pular</button>'
      + '</div>';
    }
  }

  const restanteMs = Math.max(0, sess.endsAt - Date.now());
  const restanteStr = fmtClock(restanteMs);
  const podeAvancar = answered && !sess.pendingErrorAnswerId && !sess.pendingDifficultyAnswerId;

  return Promise.resolve(''
    + '<div class="flex-between mb8"><div><span class="eyebrow">Sessão em andamento</span><h1 style="font-size:20px;">'+esc(nameOf(STATE.cache.temas, sess.temaId))+'</h1></div>'
    +   '<div class="flex-gap"><span class="timer-pill" id="timer-pill">'+ic("clock",13)+' '+restanteStr+'</span><button class="btn btn-ghost btn-sm" data-action="endSession">Encerrar sessão</button></div></div>'
    + '<div class="grid grid-3 mb16">'
    +   '<div class="card tight"><div class="stat"><span class="num">'+sess.respondidas+'</span><span class="lbl">Respondidas</span></div></div>'
    +   '<div class="card tight"><div class="stat"><span class="num">'+sess.acertos+'</span><span class="lbl">Acertos</span></div></div>'
    +   '<div class="card tight"><div class="stat"><span class="num">'+(sess.respondidas?Math.round(sess.acertos/sess.respondidas*100):0)+'%</span><span class="lbl">Aproveitamento</span></div></div>'
    + '</div>'
    + '<div class="card qcard">'
    +   '<span class="badge '+(q.tipo===CONFIG.TIPO_QUESTAO.IA?"gold":"blue")+' mb8">'+CONFIG.ROTULO_TIPO_QUESTAO[q.tipo]+'</span>'
    +   (q.dificuldade ? '<span class="badge gray mb8" style="margin-left:6px;">'+esc(q.dificuldade)+'</span>' : "")
    +   (q.tipo===CONFIG.TIPO_QUESTAO.OFICIAL && (q.banca||q.concurso||q.ano) ? '<div class="hint mb8">'+[q.banca,q.concurso,q.ano].filter(Boolean).join(" · ")+'</div>' : "")
    +   '<p style="font-size:14.5px;font-weight:500;margin-bottom:14px;">'+esc(q.enunciado)+'</p>'
    +   opcoesHtml
    + '</div>'
    + resultBlock
    + (podeAvancar ? '<button class="btn btn-primary btn-block mt16" data-action="nextQuestion">Próxima questão</button>' : "")
  );
}
function fmtClock(ms){
  const total = Math.ceil(ms/1000);
  const m = Math.floor(total/60), s = total%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
Actions.pickAlt = function(el){
  const sess = STATE.activeQuestionSession;
  const q = sess.current;
  sess.lastChosen = el.dataset.alt;
  sess.answeredCurrent = true;
  sess.respondidas++;
  const tempoSegundos = sess.questionStartedAt ? Math.round((Date.now()-sess.questionStartedAt)/1000) : 20;
  DataStore.submitAnswer({ sessionId: sess.id, userId: STATE.currentUserId, questionId: q.id, respostaEscolhida: sess.lastChosen, tempoSegundos, duvidaId: sess.duvidaId||null }).then(res => {
    sess.lastAnswerId = res.answerId;
    if(res.correta) sess.acertos++;
    else sess.pendingErrorAnswerId = res.answerId;
    sess.pendingDifficultyAnswerId = res.answerId; // captura de dificuldade percebida vale para acerto e erro
    renderScreen();
  });
};
Actions.criarDuvidaDeQuestaoErrada = function(el){
  const sess = STATE.activeQuestionSession;
  DataStore.criarDuvidaDeRespostaErrada({ userId: STATE.currentUserId, answerId: el.dataset.answerId }).then(duv => {
    if(!duv) return;
    const ir = () => { STATE.duvidaAtualId = duv.id; STATE.screen = "duvidaDetalhe"; STATE.activeQuestionSession = null; renderApp(); };
    if(sess && !sess.finished) DataStore.finishQuestionSession(sess.id).then(ir); else ir();
  });
};
Actions.submitErrorDetails = function(form){
  const fd = new FormData(form);
  DataStore.registerErrorDetails({ answerId: fd.get("answerId"), motivoErro: fd.get("motivoErro"), duvida: fd.get("duvida"), observacao: fd.get("observacao") }).then(() => {
    const sess = STATE.activeQuestionSession;
    sess.pendingErrorAnswerId = null;
    renderScreen();
  });
};
Actions.pickDifficulty = function(el){
  const sess = STATE.activeQuestionSession;
  DataStore.setAnswerDifficulty(sess.pendingDifficultyAnswerId, el.dataset.nivel).then(() => {
    sess.pendingDifficultyAnswerId = null;
    renderScreen();

Actions.endSession = function(){
  const sess = STATE.activeQuestionSession;
  if(sess.pendingErrorAnswerId){ alert("Registre o motivo do erro da questão atual antes de encerrar."); return; }
  finalizarSessaoDeQuestoes(sess).then(renderScreen);
};
// Ponto único de finalização de uma sessão de questões (chamado tanto pelo botão
// "Encerrar sessão" quanto pelo fim automático do cronômetro). Alimenta o desempenho
// de QUESTÕES da revisão daquele conteúdo, se existir (não fabrica uma se não houver),
// e — quando a sessão nasceu do Plano de Estudos — conclui automaticamente o bloco de
// questões correspondente com a duração planejada.
function finalizarSessaoDeQuestoes(sess){
  return DataStore.finishQuestionSession(sess.id).then(() => {
    sess.finished = true;
    return DataStore.registrarDesempenhoQuestoesRevisao({ userId: STATE.currentUserId, subjectId:sess.subjectId, temaId:sess.temaId, subtemaId:sess.subtemaId, total:sess.respondidas, acertos:sess.acertos });
  }).then(() => {
    if(sess.planItemId){
      return DataStore.updatePlanItem(sess.planItemId, { status:"concluido", duracaoRealizadaMin: CONFIG.DURACAO_QUESTOES_MIN });
    }
  });
}

/* ==========================================================================
   TELA — FLASHCARDS (recuperação ativa: afirmação → CERTO/ERRADO → resposta)
   --------------------------------------------------------------------------
   Fluxo: 1) mostra a afirmação; 2) usuária escolhe CERTO/ERRADO; 3) mostra a
   resposta correta; 4) registra se acertou; 5) registra data/matéria/tema/

   disponível (flashcardAnswers) para uso futuro pelo algoritmo de revisão.

SCREENS.flashcards = function(){

      + '<button class="btn btn-primary btn-sm mt12" data-action="navTo" data-screen="config">Ir para Configurações</button></div>'

      return ''

      + '<div class="empty"><div class="ic">'+ic("erros",22)+'</div><p>Ainda não há flashcards cadastrados.</p>'
      + '<p class="hint mt8">Adicione flashcards em Configurações → Flashcards.</p>'
      + '<button class="btn btn-primary btn-sm mt12" data-action="navTo" data-screen="config">Ir para Configurações</button></div>';
    }

Actions.startFlashcardSession = function(form){
  const fd = new FormData(form);
  const subjectId = fd.get("subjectId"), partId = fd.get("partId"), temaId = fd.get("temaId"), subtemaId = fd.get("subtemaId");
  if(!subjectId){ alert("Cadastre uma matéria em Configurações antes."); return; }
  DataStore.listFlashcards({ subjectId, temaId, subtemaId }).then(pool => {
    if(!pool.length){ DataStore.listFlashcards({ subjectId, temaId }).then(fallback => {
      if(!fallback.length){ alert("Não há flashcards cadastrados para este tema ainda."); return; }
      STATE.activeFlashcardSession = { pool: fallback, idx:0, current:null, revealed:false, acertos:0, respondidos:0, chosen:null };
      renderScreen();
    }); return; }
    STATE.activeFlashcardSession = { pool, idx:0, current:null, revealed:false, acertos:0, respondidos:0, chosen:null };
    renderScreen();
  });
};
function renderActiveFlashcard(){
  const sess = STATE.activeFlashcardSession;
  if(sess.idx >= sess.pool.length){
    const pct = sess.respondidos ? Math.round(sess.acertos/sess.respondidos*100) : 0;
    return Promise.resolve(''
      + '<div class="page-head"><span class="eyebrow">Concluído</span><h1>Fim dos flashcards</h1></div>'
      + '<div class="grid grid-3">'
      +   '<div class="card"><div class="stat"><span class="num">'+sess.respondidos+'</span><span class="lbl">Respondidos</span></div></div>'
      +   '<div class="card"><div class="stat"><span class="num">'+sess.acertos+'</span><span class="lbl">Acertos</span></div></div>'
      +   '<div class="card"><div class="stat"><span class="num">'+pct+'%</span><span class="lbl">Aproveitamento</span></div></div>'
      + '</div>'
      + '<button class="btn btn-primary mt16" data-action="endFlashcardSession">Voltar</button>'
    );
  }
  const f = sess.current || (sess.current = sess.pool[sess.idx]);
  const opcoesHtml = CONFIG.RESPOSTAS_CERTO_ERRADO.map(opt => {
    let cls = "alt";
    if(sess.revealed){
      if(opt===f.respostaCorreta) cls += " correct";
      else if(opt===sess.chosen) cls += " wrong";
    }
    return '<div class="'+cls+'" '+(sess.revealed?'':'data-action="answerFlashcard" data-alt="'+opt+'"')+'><span class="letter">'+(opt==="CERTO"?"C":"E")+'</span><span>'+opt+'</span></div>';
  }).join("");
  return Promise.resolve(''
    + '<div class="flex-between mb8"><div><span class="eyebrow">Flashcard '+(sess.idx+1)+' de '+sess.pool.length+'</span><h1 style="font-size:20px;">'+esc(nameOf(STATE.cache.temas,f.temaId))+'</h1></div>'
    +   '<button class="btn btn-ghost btn-sm" data-action="endFlashcardSession">Encerrar</button></div>'
    + '<div class="card qcard"><p style="font-size:14.5px;font-weight:500;margin-bottom:14px;">'+esc(f.afirmacao)+'</p>'+opcoesHtml+'</div>'
    + (sess.revealed ? '<div class="card tight mt12" style="background:'+(sess.chosen===f.respostaCorreta?'var(--primary-soft)':'var(--danger-soft)')+';"><strong>'+(sess.chosen===f.respostaCorreta?'✓ Você acertou':'✕ Você errou')+'</strong>'+(f.explicacao?'<p style="font-size:13px;margin-top:6px;">'+esc(f.explicacao)+'</p>':"")+'</div><button class="btn btn-primary btn-block mt16" data-action="nextFlashcard">Próximo</button>' : "")
  );
}
Actions.answerFlashcard = function(el){
  const sess = STATE.activeFlashcardSession;
  const f = sess.current;
  sess.chosen = el.dataset.alt;
  sess.revealed = true;
  sess.respondidos++;
  DataStore.submitFlashcardAnswer({ userId: STATE.currentUserId, flashcardId: f.id, respostaEscolhida: sess.chosen }).then(res => {
    if(res.correta) sess.acertos++;
    renderScreen();
  });
};
Actions.nextFlashcard = function(){
  const sess = STATE.activeFlashcardSession;
  sess.idx++; sess.current = null; sess.revealed = false; sess.chosen = null;
  renderScreen();
};
Actions.endFlashcardSession = function(){
  STATE.activeFlashcardSession = null;
  renderScreen();
};

            + '</form>'
            + (duv.compreensao==="resolvi" && duv.status!=="resolvida" ? '<p class="hint mt8">Marcar "Entendi" ainda não fecha a dúvida sozinho — confirme quando tiver certeza.</p><button class="btn btn-primary btn-sm mt8" data-action="confirmarDuvidaResolvida" data-id="'+duv.id+'">Confirmar como resolvida</button>' : "")
          : '<p class="mt8" style="font-size:13.5px;">'+(duv.compreensao?CONFIG.ROTULO_DUVIDA_COMPREENSAO[duv.compreensao]:"Ainda não avaliada")+'</p>'+(duv.comentarioCompreensao?'<p class="text-soft" style="font-size:12.5px;">'+esc(duv.comentarioCompreensao)+'</p>':''))

        + renderContextoIA(contextoIA)
        + '</div>' : "";

      const secaoDebate = '<div class="card mb16"><span class="eyebrow">Debate</span>'
        + (mensagens.length ? '<div class="mt8">'+mensagens.map(m => '<div class="card tight mt8" style="background:'+(m.tipo==="ia"?"var(--info-soft)":"var(--surface-alt)")+';"><div class="flex-between"><strong style="font-size:12.5px;">'+esc(m.autor)+(m.tipo==="ia"?' <span class="badge blue">IA</span>':'')+'</strong><span class="hint">'+fmtDateBR(m.data)+'</span></div><p style="font-size:13px;margin-top:4px;">'+esc(m.texto)+'</p></div>').join("")+'</div>' : '<p class="text-soft mt8" style="font-size:13px;">Nenhuma mensagem ainda. "Mas por que nesse caso acontece isso?" — comece a conversa.</p>')
        + '<form data-form="submitDuvidaMensagem" class="mt12"><input type="hidden" name="id" value="'+duv.id+'">'
        +   '<div class="field"><textarea name="texto" id="duvida-msg-texto" placeholder="Escreva uma pergunta ou comentário" required></textarea></div>'
        +   '<div class="flex-gap"><button class="btn btn-ghost btn-sm" type="submit">Enviar para o debate</button>'
        +   '<button class="btn btn-ghost btn-sm" type="button" data-action="perguntarIA" data-id="'+duv.id+'">Perguntar à IA</button></div>'
        + '</form>'
        + '<div id="resposta-ia-notice"></div>'
        + '</div>';

      const secaoTeste = '<div class="card mb16"><span class="eyebrow">Teste de compreensão gerado por IA</span>'
        + (testes.length ? '<div class="hint mt8">'+testes.length+' teste(s) solicitado(s) — geração automática de perguntas ainda não integrada.</div>' : '<p class="text-soft mt8" style="font-size:13px;">Nenhum teste solicitado ainda. Estas perguntas nunca são questões oficiais.</p>')
        + '<div class="flex-gap mt8">'
        +   '<button class="btn btn-ghost btn-sm" data-action="pedirTesteCompreensao" data-id="'+duv.id+'">Testar se eu entendi</button>'
        +   '<button class="btn btn-ghost btn-sm" data-action="pedirQuestaoIA" data-id="'+duv.id+'">Gerar questão de prática (IA)</button>'
        +   (duv.subjectId ? '<button class="btn btn-primary btn-sm" data-action="iniciarQuestoesDaDuvida" data-id="'+duv.id+'">Praticar questões Cebraspe</button>' : '')
        + '</div></div>';

      const eventos = [];
      eventos.push({ data: duv.dataCriacao, texto: "Dúvida criada" });
      fontes.forEach(f => eventos.push({ data: f.dataConsulta, texto: "Fonte consultada: "+f.tipo }));
      mensagens.forEach(m => eventos.push({ data: m.data, texto: "Mensagem de "+m.autor }));
      (duv.historicoExplicacoes||[]).forEach(h => eventos.push({ data: h.data, texto: "Explicação solicitada (nº"+h.numero+")" }));
      (duv.historicoReforcos||[]).forEach(h => eventos.push({ data: h.data, texto: "Reforço solicitado (nº"+h.numero+")" }));
      testes.forEach(t => eventos.push({ data: t.data, texto: "Teste de compreensão solicitado" }));
      if(duv.dataResolucao) eventos.push({ data: duv.dataResolucao, texto: "Dúvida marcada como resolvida" });
      eventos.sort((a,b)=>a.data.localeCompare(b.data));
      const secaoLinhaTempo = '<div class="card"><span class="eyebrow">Linha do tempo</span><ul style="margin:8px 0 0;padding-left:18px;">'
        + eventos.map(e => '<li style="font-size:12.5px;padding:2px 0;">'+fmtDateBR(e.data)+' — '+esc(e.texto)+'</li>').join("")
        + '</ul></div>';

      return cabecalho + secaoPergunta + secaoOrigem + secaoFontes + secaoExplicacaoIA + secaoCompreensao + secaoReforco + secaoDebate + secaoTeste + secaoLinhaTempo;
    });
  });
};

// Monta o contexto de uma dúvida a partir do DataStore (reaproveitado por todas as ações de IA).
function montarContextoParaDuvida(duvidaId, pedirNovaAbordagem){
  return Promise.all([
    DataStore.getDuvida(duvidaId), DataStore.listDuvidaFontes(duvidaId), DataStore.listDuvidaMensagens(duvidaId)
  ]).then(([duv, fontes, mensagens]) => {
    const questaoP = duv.questionId ? DataStore.getQuestion(duv.questionId) : Promise.resolve(null);
    return questaoP.then(questao => montarContextoDuvidaIA({
      duvida: duv, fontes, mensagens, questao,
      materiaNome: duv.subjectId ? nameOf(STATE.cache.subjects, duv.subjectId) : null,
      temaNome: duv.temaId ? nameOf(STATE.cache.temas, duv.temaId) : null,
      subtemaNome: duv.subtemaId ? nameOf(STATE.cache.subtemas, duv.subtemaId) : null,
      pedirNovaAbordagem: !!pedirNovaAbordagem
    }));
  });
}
// "Explicar para mim" — monta o contexto real da dúvida, chama a IA de verdade (se
// configurada) e registra a tentativa no histórico da dúvida. Sem endpoint configurado,
// mostra a mensagem honesta; com endpoint, mostra a resposta real validada.
Actions.pedirExplicacaoIA = function(el){
  const duvidaId = el.dataset.id;
  montarContextoParaDuvida(duvidaId, false).then(contexto => {
    return AIService.solicitarExplicacao(contexto).then(res => {
      return DataStore.registrarTentativaExplicacao(duvidaId).then(() => {
        if(res.ok){
          STATE.ultimaExplicacaoIA = STATE.ultimaExplicacaoIA || {};
          STATE.ultimaExplicacaoIA[duvidaId] = res.resposta.texto;
        } else {
          alert(res.motivo);
        }
        renderScreen();
      });
    });
  });
};

// "Gerar questão de prática (IA)" — quando a IA responde de verdade, cria as questões
// no banco com tipo:"ia" (nunca oficial); sem conexão, apenas mostra a mensagem honesta.
Actions.pedirQuestaoIA = function(el){
  const duvidaId = el.dataset.id;
  Promise.all([montarContextoParaDuvida(duvidaId, false), DataStore.getDuvida(duvidaId)]).then(([contexto, duv]) => {
    return AIService.solicitarQuestoesPratica(contexto).then(res => {
      return DataStore.registrarTentativaQuestaoIA(duvidaId).then(() => {
        if(res.ok){
          const questoes = res.resposta.questoes || res.resposta.perguntas || [];
          return DataStore.criarQuestoesIA(duvidaId, duv.subjectId, duv.partId, duv.temaId, duv.subtemaId, questoes).then(() => renderScreen());
        }
        alert(res.motivo); renderScreen();
      });
    });
  });
};
// "Perguntar à IA" no chat da dúvida — NUNCA insere uma mensagem falsa tipo "ia" no
// debate quando não há conexão. Com endpoint configurado e resposta válida, a resposta
// real da IA é inserida no debate como uma mensagem tipo "ia" de verdade.
Actions.perguntarIA = function(el){
  const duvidaId = el.dataset.id;
  const textarea = document.getElementById("duvida-msg-texto");
  const pergunta = textarea ? textarea.value.trim() : "";
  if(!pergunta){ alert("Escreva sua pergunta no campo antes de perguntar à IA."); return; }
  Promise.all([
    DataStore.getDuvida(duvidaId), DataStore.listDuvidaFontes(duvidaId), DataStore.listDuvidaMensagens(duvidaId)
  ]).then(([duv, fontes, mensagens]) => {
    const questaoP = duv.questionId ? DataStore.getQuestion(duv.questionId) : Promise.resolve(null);
    return questaoP.then(questao => {
      const contexto = montarContextoDuvidaIA({
        duvida: Object.assign({}, duv, { pergunta: pergunta }), fontes, mensagens, questao,
        materiaNome: duv.subjectId ? nameOf(STATE.cache.subjects, duv.subjectId) : null,
        temaNome: duv.temaId ? nameOf(STATE.cache.temas, duv.temaId) : null,
        subtemaNome: duv.subtemaId ? nameOf(STATE.cache.subtemas, duv.subtemaId) : null
      });
      return AIService.solicitarRespostaChat(contexto).then(res => {
        if(res.ok){
          return DataStore.addDuvidaMensagem({ duvidaId, userId: STATE.currentUserId, autor: currentUser().nome, tipo:"usuario", texto: pergunta })
            .then(() => DataStore.addDuvidaMensagem({ duvidaId, userId: STATE.currentUserId, autor:"IA", tipo:"ia", texto: res.resposta.texto }))
            .then(() => { if(textarea) textarea.value=""; renderScreen(); });
        }
        const box = document.getElementById("resposta-ia-notice");
        if(box) box.innerHTML = '<div class="card tight mt8" style="background:var(--info-soft);"><strong>'+(res.configurado?"A chamada à IA falhou":"IA ainda não conectada")+'</strong><p style="font-size:13px;margin-top:6px;">'+esc(res.motivo)+'</p>'+renderContextoIA(res.contextoEnviado)+'</div>';
      });
    });
  });
};

/* ==========================================================================
   TELA — REVISÕES (motor unificado por conteúdo — Rules.calcNextReview)
   --------------------------------------------------------------------------
   4 abas: Revisar hoje / Atrasadas / Próximas / Histórico. Tudo lido de
   DataStore.revisoes — não existe mais uma segunda lógica de revisão aqui.
   ========================================================================== */
function revisaoCard(r, comBotao){
  return '<div class="card mt12">'
    + '<div class="flex-between"><div><strong>'+esc(nameOf(STATE.cache.temas,r.temaId))+'</strong>'
    +   '<div class="text-soft" style="font-size:12px;margin-top:3px;">'+esc(nameOf(STATE.cache.subjects,r.subjectId))+(r.subtemaId?' · '+esc(nameOf(STATE.cache.subtemas,r.subtemaId)):'')+' · estudado em '+fmtDateBR(r.dataEstudoOriginal)+'</div></div>'
    +   '<span class="badge '+({novo:"gray",estudado:"blue",revisao_pendente:"gold",revisao_concluida:"green",baixa_retencao:"red",dominado:"green",precisa_reforco:"red"}[r.estado]||"gray")+'">'+esc(CONFIG.ROTULO_STATUS_PLANO&&""||"")+esc({novo:"Novo",estudado:"Estudado",revisao_pendente:"Revisão pendente",revisao_concluida:"Revisão concluída",baixa_retencao:"Baixa retenção",dominado:"Dominado",precisa_reforco:"Precisa de reforço"}[r.estado]||r.estado)+'</span>'
    + '</div>'
    + '<div class="hint mt8">Próxima revisão: '+fmtDateBR(r.proximaRevisaoData)+' · questões: '+r.desempenhoQuestoes.total+' ('+r.desempenhoQuestoes.acertos+' acertos) · flashcards: '+r.desempenhoFlashcards.total+' ('+r.desempenhoFlashcards.acertos+' acertos)</div>'
    + (comBotao ? '<button class="btn btn-primary btn-sm mt8" data-action="iniciarRevisaoAtiva" data-id="'+r.id+'">Revisar</button>' : "")
    + '</div>';
}
SCREENS.revisoes = function(){
  if(STATE.activeRevisaoSession) return renderRevisaoAtiva();
  const tabs = [["hoje","Revisar hoje"],["atrasadas","Atrasadas"],["proximas","Próximas revisões"],["historico","Histórico"]]
    .map(([id,label]) => '<button class="tab '+(STATE.revisoesTab===id?"active":"")+'" data-action="setRevisoesTab" data-tab="'+id+'">'+label+'</button>').join("");
  const hoje = todayISO();

  let bodyPromise;
  if(STATE.revisoesTab==="hoje"){
    bodyPromise = DataStore.listRevisoesDueToday(STATE.currentUserId).then(lista => {
      const doDia = lista.filter(r=>r.proximaRevisaoData===hoje);
      return doDia.length ? doDia.map(r=>revisaoCard(r,true)).join("") : '<div class="empty"><div class="ic">'+ic("check",22)+'</div><p>Nenhuma revisão pendente para hoje. Bom trabalho!</p></div>';
    });
  } else if(STATE.revisoesTab==="atrasadas"){
    bodyPromise = DataStore.listRevisoesDueToday(STATE.currentUserId).then(lista => {
      const atrasadas = lista.filter(r=>r.proximaRevisaoData<hoje);
      return atrasadas.length ? atrasadas.map(r=>revisaoCard(r,true)).join("") : '<div class="empty"><p>Nenhuma revisão atrasada.</p></div>';
    });
  } else if(STATE.revisoesTab==="proximas"){
    bodyPromise = DataStore.listRevisoesProximas(STATE.currentUserId).then(lista => {
      if(!lista.length) return '<div class="empty"><p>Nenhuma revisão futura agendada ainda — elas aparecem aqui conforme você conclui conteúdos no Plano.</p></div>';
      const diffDias = (iso) => Math.round((new Date(iso+"T00:00:00") - new Date(hoje+"T00:00:00"))/86400000);
      const grupos = { amanha:[], tres:[], sete:[], depois:[] };
      lista.forEach(r => { const dd = diffDias(r.proximaRevisaoData); if(dd<=1) grupos.amanha.push(r); else if(dd<=3) grupos.tres.push(r); else if(dd<=7) grupos.sete.push(r); else grupos.depois.push(r); });
      const secao = (titulo, arr) => arr.length ? '<h3 class="mt16 mb8">'+titulo+'</h3>'+arr.map(r=>revisaoCard(r,false)).join("") : "";
      return secao("Amanhã", grupos.amanha) + secao("Próximos 3 dias", grupos.tres) + secao("Próximos 7 dias", grupos.sete) + secao("Semanas seguintes", grupos.depois);
    });
  } else {
    bodyPromise = DataStore.listHistoricoRevisoes(STATE.currentUserId).then(lista => {
      const relevante = lista.filter(h=>h.metodo!=="estudo");
      if(!relevante.length) return '<div class="empty"><p>Nenhuma revisão concluída ainda.</p></div>';
      return '<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Conteúdo</th><th>Método</th><th>Resultado</th><th>Próxima revisão</th></tr></thead><tbody>'
        + relevante.map(h => '<tr><td>'+fmtDateBR(h.data)+'</td><td>'+esc(nameOf(STATE.cache.temas,h.temaId))+'</td><td>'+esc(h.metodo)+'</td><td>'+(h.respondidas!=null?h.respondidas+' resp. · '+h.acertos+' acertos'+(h.percentual!=null?' ('+h.percentual+'%)':''):'—')+'</td><td>'+(h.proximaRevisaoDepois?fmtDateBR(h.proximaRevisaoDepois):'—')+'</td></tr>').join("")
        + '</tbody></table></div>';
    });
  }
  return bodyPromise.then(body => ''
    + '<div class="page-head"><span class="eyebrow">Repetição espaçada</span><h1>Revisões</h1><p class="desc">Janelas iniciais: 1 → 3 → 7 dias, crescendo progressivamente até 30+ dias conforme os acertos.</p></div>'
    + '<div class="tabs">'+tabs+'</div>'
    + body
  );
};

/* ---------------------- Revisão ativa (recuperação ativa: questões + flashcards) ---------------------- */
Actions.iniciarRevisaoAtiva = function(el){
  const revisaoId = el.dataset.id;
  DataStore.getRevisao(revisaoId).then(r => {
    if(!r) return;
    Promise.all([
      DataStore.listQuestions({ subjectId:r.subjectId, temaId:r.temaId, subtemaId:r.subtemaId, apenasAtivas:true }),
      DataStore.listFlashcards({ subjectId:r.subjectId, temaId:r.temaId, subtemaId:r.subtemaId })
    ]).then(([poolQuestoes, poolFlashcards]) => {
      STATE.activeRevisaoSession = {
        revisaoId, subjectId:r.subjectId, temaId:r.temaId, subtemaId:r.subtemaId,
        fase: poolQuestoes.length ? "questoes" : (poolFlashcards.length ? "flashcards" : "sem_pratica"),
        poolQuestoes, idxQ:0, totalQuestoes:0, acertosQuestoes:0, currentQ:null, answeredQ:false, pendingErrorAnswerId:null,
        poolFlashcards, idxF:0, totalFlashcards:0, acertosFlashcards:0, currentF:null, revealedF:false, chosenF:null,
        finalizada:false
      };
      renderScreen();
    });
  });
};
function renderRevisaoAtiva(){
  const s = STATE.activeRevisaoSession;
  if(s.finalizada) return renderRevisaoResultado();
  if(s.fase==="sem_pratica"){
    return Promise.resolve(''
      + '<div class="page-head"><span class="eyebrow">Revisão</span><h1>'+esc(nameOf(STATE.cache.temas,s.temaId))+'</h1></div>'
      + '<div class="empty"><p>Ainda não há questões nem flashcards cadastrados para este conteúdo — não é possível medir desempenho real agora.</p>'
      + '<button class="btn btn-primary btn-sm mt12" data-action="finalizarRevisaoSemPratica">Marcar como revisado (sem prática mensurável)</button></div>'
    );
  }
  if(s.fase==="questoes"){
    if(s.idxQ >= s.poolQuestoes.length){ s.fase = s.poolFlashcards.length ? "flashcards" : "concluir"; return renderRevisaoAtiva(); }
    const q = s.currentQ || (s.currentQ = s.poolQuestoes[s.idxQ]);
    const opcoes = CONFIG.RESPOSTAS_CERTO_ERRADO.map(opt => {
      let cls = "alt";
      if(s.answeredQ){ if(opt===q.respostaCorreta) cls+=" correct"; else if(opt===s.lastChosenQ) cls+=" wrong"; }
      return '<div class="'+cls+'" '+(s.answeredQ?'':'data-action="revisaoPickAlt" data-alt="'+opt+'"')+'><span class="letter">'+(opt==="CERTO"?"C":"E")+'</span><span>'+opt+'</span></div>';
    }).join("");
    let resultBlock = "";
    if(s.answeredQ){
      const correta = s.lastChosenQ === q.respostaCorreta;
      resultBlock = '<div class="card tight mt12" style="background:'+(correta?'var(--primary-soft)':'var(--danger-soft)')+';"><strong>'+(correta?'✓ Resposta correta':'✕ Resposta incorreta')+'</strong><p style="font-size:13px;margin-top:6px;">'+esc(q.explicacao)+'</p></div>';
      if(!correta && s.pendingErrorAnswerId){
        resultBlock += '<div class="card tight mt12"><h3 class="mb8" style="font-size:14px;">Por que você errou?</h3><form data-form="revisaoSubmitErrorDetails"><input type="hidden" name="answerId" value="'+s.pendingErrorAnswerId+'">'
          + '<div class="field"><label>Motivo do erro</label><select name="motivoErro" required><option value="">Selecione…</option>'+CONFIG.MOTIVOS_ERRO.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join("")+'</select></div>'
          + '<button class="btn btn-primary btn-block" type="submit">Salvar e continuar</button></form></div>';
      }
    }
    const podeAvancar = s.answeredQ && !s.pendingErrorAnswerId;
    return Promise.resolve(''
      + '<div class="flex-between mb8"><div><span class="eyebrow">Revisão · Questões ('+(s.idxQ+1)+'/'+s.poolQuestoes.length+')</span><h1 style="font-size:20px;">'+esc(nameOf(STATE.cache.temas,s.temaId))+'</h1></div><button class="btn btn-ghost btn-sm" data-action="pularParteQuestoesRevisao">Pular para flashcards/concluir</button></div>'
      + '<div class="card qcard"><span class="badge '+(q.tipo===CONFIG.TIPO_QUESTAO.IA?"gold":"blue")+' mb8">'+CONFIG.ROTULO_TIPO_QUESTAO[q.tipo]+'</span><p style="font-size:14.5px;font-weight:500;margin-bottom:14px;">'+esc(q.enunciado)+'</p>'+opcoes+'</div>'
      + resultBlock
      + (podeAvancar ? '<button class="btn btn-primary btn-block mt16" data-action="revisaoNextQuestao">Próxima</button>' : "")
    );
  }
  if(s.fase==="flashcards"){
    if(s.idxF >= s.poolFlashcards.length){ s.fase = "concluir"; return renderRevisaoAtiva(); }
    const f = s.currentF || (s.currentF = s.poolFlashcards[s.idxF]);
    const opcoes = CONFIG.RESPOSTAS_CERTO_ERRADO.map(opt => {
      let cls = "alt";
      if(s.revealedF){ if(opt===f.respostaCorreta) cls+=" correct"; else if(opt===s.chosenF) cls+=" wrong"; }
      return '<div class="'+cls+'" '+(s.revealedF?'':'data-action="revisaoAnswerFlashcard" data-alt="'+opt+'"')+'><span class="letter">'+(opt==="CERTO"?"C":"E")+'</span><span>'+opt+'</span></div>';
    }).join("");
    return Promise.resolve(''
      + '<div class="flex-between mb8"><div><span class="eyebrow">Revisão · Flashcards ('+(s.idxF+1)+'/'+s.poolFlashcards.length+')</span><h1 style="font-size:20px;">'+esc(nameOf(STATE.cache.temas,s.temaId))+'</h1></div><button class="btn btn-ghost btn-sm" data-action="pularParteFlashcardsRevisao">Pular para conclusão</button></div>'
      + '<div class="card qcard"><p style="font-size:14.5px;font-weight:500;margin-bottom:14px;">'+esc(f.afirmacao)+'</p>'+opcoes+'</div>'
      + (s.revealedF ? '<div class="card tight mt12" style="background:'+(s.chosenF===f.respostaCorreta?'var(--primary-soft)':'var(--danger-soft)')+';"><strong>'+(s.chosenF===f.respostaCorreta?'✓ Você acertou':'✕ Você errou')+'</strong>'+(f.explicacao?'<p style="font-size:13px;margin-top:6px;">'+esc(f.explicacao)+'</p>':"")+'</div><button class="btn btn-primary btn-block mt16" data-action="revisaoNextFlashcard">Próximo</button>' : "")
    );
  }
  // fase === "concluir"
  return Promise.resolve(''
    + '<div class="page-head"><span class="eyebrow">Revisão</span><h1>Concluir revisão</h1></div>'
    + '<div class="grid grid-2 mb16">'
    +   '<div class="card"><h3 class="mb8">Questões</h3><div class="stat"><span class="num">'+s.acertosQuestoes+'/'+s.totalQuestoes+'</span><span class="lbl">acertos</span></div></div>'
    +   '<div class="card"><h3 class="mb8">Flashcards</h3><div class="stat"><span class="num">'+s.acertosFlashcards+'/'+s.totalFlashcards+'</span><span class="lbl">acertos</span></div></div>'
    + '</div>'
    + '<button class="btn btn-primary" data-action="concluirRevisaoAtiva">Finalizar revisão</button>'
  );
}
Actions.revisaoPickAlt = function(el){
  const s = STATE.activeRevisaoSession;
  const q = s.currentQ;
  s.lastChosenQ = el.dataset.alt; s.answeredQ = true; s.totalQuestoes++;
  DataStore.submitAnswer({ sessionId:null, userId: STATE.currentUserId, questionId:q.id, respostaEscolhida:s.lastChosenQ, tempoSegundos:0 }).then(res => {
    if(res.correta) s.acertosQuestoes++; else s.pendingErrorAnswerId = res.answerId;
    renderScreen();
  });
};
Actions.revisaoSubmitErrorDetails = function(form){
  const fd = new FormData(form);
  DataStore.registerErrorDetails({ answerId: fd.get("answerId"), motivoErro: fd.get("motivoErro"), duvida:"", observacao:"" }).then(() => {
    STATE.activeRevisaoSession.pendingErrorAnswerId = null;
    renderScreen();
  });
};
Actions.revisaoNextQuestao = function(){
  const s = STATE.activeRevisaoSession;
  s.idxQ++; s.currentQ = null; s.answeredQ = false; s.lastChosenQ = null;
  renderScreen();
};
Actions.pularParteQuestoesRevisao = function(){
  const s = STATE.activeRevisaoSession;
  s.fase = s.poolFlashcards.length ? "flashcards" : "concluir";
  renderScreen();
};
Actions.revisaoAnswerFlashcard = function(el){
  const s = STATE.activeRevisaoSession;
  const f = s.currentF;
  s.chosenF = el.dataset.alt; s.revealedF = true; s.totalFlashcards++;
  DataStore.submitFlashcardAnswer({ userId: STATE.currentUserId, flashcardId:f.id, respostaEscolhida:s.chosenF }).then(res => {
    if(res.correta) s.acertosFlashcards++;
    renderScreen();
  });
};
Actions.revisaoNextFlashcard = function(){
  const s = STATE.activeRevisaoSession;
  s.idxF++; s.currentF = null; s.revealedF = false; s.chosenF = null;
  renderScreen();
};
Actions.pularParteFlashcardsRevisao = function(){
  STATE.activeRevisaoSession.fase = "concluir";
  renderScreen();
};
Actions.concluirRevisaoAtiva = function(){
  const s = STATE.activeRevisaoSession;
  DataStore.finalizarRevisaoAtiva({ revisaoId:s.revisaoId, totalQuestoes:s.totalQuestoes, acertosQuestoes:s.acertosQuestoes, totalFlashcards:s.totalFlashcards, acertosFlashcards:s.acertosFlashcards }).then(r => {
    s.resultado = r; s.finalizada = true; renderScreen();
  });
};
Actions.finalizarRevisaoSemPratica = function(){
  const s = STATE.activeRevisaoSession;
  DataStore.finalizarRevisaoAtiva({ revisaoId:s.revisaoId, totalQuestoes:0, acertosQuestoes:0, totalFlashcards:0, acertosFlashcards:0 }).then(r => {
    s.resultado = r; s.finalizada = true; renderScreen();
  });
};
function renderRevisaoResultado(){
  const s = STATE.activeRevisaoSession;
  const r = s.resultado;
  const total = s.totalQuestoes + s.totalFlashcards, acertos = s.acertosQuestoes + s.acertosFlashcards;
  const pct = total ? Math.round(acertos/total*100) : null;
  return Promise.resolve(''
    + '<div class="page-head"><span class="eyebrow">Revisão concluída</span><h1>Resultado da revisão</h1></div>'
    + '<div class="grid grid-2 mb16">'
    +   '<div class="card"><div class="stat"><span class="num">'+s.totalQuestoes+'</span><span class="lbl">Questões respondidas</span></div><div class="hint mt8">'+s.acertosQuestoes+' acertos</div></div>'
    +   '<div class="card"><div class="stat"><span class="num">'+s.totalFlashcards+'</span><span class="lbl">Flashcards respondidos</span></div><div class="hint mt8">'+s.acertosFlashcards+' acertos</div></div>'
    + '</div>'
    + '<div class="card"><div class="flex-gap"><span class="badge blue">'+(pct!=null?pct+'% de aproveitamento':'Sem prática mensurável')+'</span>'+(r?'<span class="badge '+({novo:"gray",estudado:"blue",revisao_pendente:"gold",revisao_concluida:"green",baixa_retencao:"red",dominado:"green",precisa_reforco:"red"}[r.estado]||"gray")+'">'+esc({novo:"Novo",estudado:"Estudado",revisao_pendente:"Revisão pendente",revisao_concluida:"Revisão concluída",baixa_retencao:"Baixa retenção",dominado:"Dominado",precisa_reforco:"Precisa de reforço"}[r.estado]||r.estado)+'</span>':'')+'</div>'
    +   (r ? '<p class="hint mt8">Próxima revisão: '+fmtDateBR(r.proximaRevisaoData)+'</p>' : "")
    + '</div>'
    + '<button class="btn btn-primary mt16" data-action="voltarDeRevisao">Voltar para Revisões</button>'
  );
}
Actions.voltarDeRevisao = function(){
  STATE.activeRevisaoSession = null;
  renderScreen();
};

    const rows = entries.length ? entries.map(e => ''

      +   '<div class="flex-between"><div>'
      +     '<strong>'+esc(nameOf(STATE.cache.temas,e.temaId))+'</strong> <span class="text-soft" style="font-size:12px;">· '+esc(nameOf(STATE.cache.subjects,e.subjectId))+'</span>'
      +     '<div class="text-soft" style="font-size:12px;margin-top:2px;">'+esc(nameOf(STATE.cache.subtemas,e.subtemaId))+' · '+fmtDateBR(e.data)+'</div>'

Actions.setErrosTab = function(el){ STATE.errosTab = el.dataset.tab; renderScreen(); };
Actions.markErrorStatus = function(el){ DataStore.updateErrorEntry(el.dataset.id, { status: el.dataset.status }).then(renderScreen); };

/* ==========================================================================
   TELA — METAS
   ========================================================================== */
const GOAL_DEFS = [
  { tipo:"diaria_questoes", label:"Meta diária de questões", unidade:"questões/dia" },
  { tipo:"semanal_questoes", label:"Meta semanal de questões", unidade:"questões/semana" },
  { tipo:"mensal_questoes", label:"Meta mensal de questões", unidade:"questões/mês" },
  { tipo:"percentual_acerto", label:"Meta de percentual de acerto", unidade:"% de acerto" },
  { tipo:"tempo_semanal_min", label:"Meta de tempo de estudo semanal", unidade:"minutos/semana" }
];
SCREENS.metas = function(){
  return Promise.all([DataStore.listGoals(STATE.currentUserId), DataStore.listAnswers({userId:STATE.currentUserId}), DataStore.listPlanItems(STATE.currentUserId)])
    .then(([goals, answers, plan]) => {
      const hoje = todayISO();
      const respondidasHoje = answers.filter(a=>a.data===hoje).length;
      const stats = Rules.calcPerformanceStats(answers);
      const tempoConcluido = plan.filter(p=>p.status==="concluido").reduce((s,p)=>s+(p.duracaoRealizadaMin||0),0);
      const atuais = { diaria_questoes: respondidasHoje, semanal_questoes: answers.length, mensal_questoes: answers.length, percentual_acerto: stats.percentual, tempo_semanal_min: tempoConcluido };
      const cards = GOAL_DEFS.map(def => {
        const g = goals.find(x=>x.tipo===def.tipo);
        const alvo = g ? g.valorAlvo : 0;
        const atual = atuais[def.tipo] || 0;
        const pct = Rules.calcGoalProgress(atual, alvo);
        return '<div class="card">'
          + '<div class="card-row"><h3>'+def.label+'</h3><button class="btn btn-ghost btn-sm" data-action="editGoal" data-tipo="'+def.tipo+'" data-label="'+def.label+'" data-unidade="'+def.unidade+'">Editar</button></div>'
          + '<div class="flex-between mb8"><span class="text-soft" style="font-size:13px;">'+atual+' / '+(alvo||"—")+' '+def.unidade+'</span><strong>'+pct+'%</strong></div>'
          + '<div class="progress"><span style="width:'+pct+'%"></span></div>'
        + '</div>';
      }).join("");
      return '<div class="page-head"><span class="eyebrow">Objetivos</span><h1>Metas</h1></div><div class="grid grid-2">'+cards+'</div>';
    });
};
Actions.editGoal = function(el){
  openModal(''
    + '<button class="modal-close" data-action="closeModal">'+ic("close",16)+'</button>'
    + '<h3>'+esc(el.dataset.label)+'</h3>'
    + '<form data-form="submitGoal"><input type="hidden" name="tipo" value="'+el.dataset.tipo+'">'
    +   '<div class="field"><label>Valor alvo ('+esc(el.dataset.unidade)+')</label><input type="number" name="valor" min="1" required></div>'
    +   '<button class="btn btn-primary btn-block" type="submit">Salvar meta</button>'
    + '</form>'
  );
};
Actions.submitGoal = function(form){
  const fd = new FormData(form);
  DataStore.setGoal(STATE.currentUserId, fd.get("tipo"), Number(fd.get("valor"))).then(() => { modalRoot.innerHTML=""; renderScreen(); });
};

/* ==========================================================================
   TELA — DESEMPENHO
   ========================================================================== */
SCREENS.desempenho = function(){
  return Promise.all([
    DataStore.listAnswers({userId:STATE.currentUserId}),
    DataStore.listFlashcardAnswers({userId:STATE.currentUserId})
  ]).then(([answers, fcAnswers]) => {
    const geral = Rules.calcPerformanceStats(answers);
    const porMateria = Rules.groupPerformanceBy(answers, "subjectId");
    const porParte = Rules.groupPerformanceBy(answers, "partId");
    const porTemaBase = Rules.groupPerformanceBy(answers, "temaId");
    const porTema = Rules.calcTemaPriority(porTemaBase);
    const porSubtema = Rules.groupPerformanceBy(answers, "subtemaId");
    const geralFc = Rules.calcPerformanceStats(fcAnswers);
    const rowsMateria = porMateria.length ? porMateria.map(g => perfRow(nameOf(STATE.cache.subjects, g.key), g)).join("") : '<tr><td colspan="5" class="text-soft">Sem dados ainda.</td></tr>';
    const rowsParte = porParte.length ? porParte.map(g => perfRow(nameOf(STATE.cache.parts, g.key), g)).join("") : '<tr><td colspan="5" class="text-soft">Sem dados ainda.</td></tr>';
    const rowsTema = porTema.length ? porTema.map(g => perfRowComRotulos(nameOf(STATE.cache.temas, g.key), g)).join("") : '<tr><td colspan="6" class="text-soft">Sem dados ainda.</td></tr>';
    const rowsSubtema = porSubtema.length ? porSubtema.map(g => perfRow(nameOf(STATE.cache.subtemas, g.key), g)).join("") : '<tr><td colspan="5" class="text-soft">Sem dados ainda.</td></tr>';
    const perfil = Rules.calcRetentionProfile(answers.map(a => ({ correta:a.correta, dificuldadePercebida:a.dificuldadePercebida })));
    return ''
    + '<div class="page-head"><span class="eyebrow">Análise</span><h1>Desempenho</h1></div>'
    + '<div class="grid grid-4 mb16">'
    +   '<div class="card"><div class="stat"><span class="num">'+geral.total+'</span><span class="lbl">Questões respondidas</span></div></div>'
    +   '<div class="card"><div class="stat"><span class="num">'+geral.acertos+'</span><span class="lbl">Acertos</span></div></div>'
    +   '<div class="card"><div class="stat"><span class="num">'+geral.erros+'</span><span class="lbl">Erros</span></div></div>'
    +   '<div class="card"><div class="stat"><span class="num">'+geral.percentual+'%</span><span class="lbl">Percentual de acerto</span></div></div>'
    + '</div>'
    + '<div class="hint mb16">Tempo médio de resposta em questões: '+geral.tempoMedioSegundos+'s</div>'
    + '<div class="card mb16"><h3 class="mb8">Por matéria</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Matéria</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>'+rowsMateria+'</tbody></table></div></div>'
    + '<div class="card mb16"><h3 class="mb8">Por parte</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Parte</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>'+rowsParte+'</tbody></table></div></div>'
    + '<div class="card mb16"><h3 class="mb8">Por tema</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Tema</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>%</th><th>Prioridade</th></tr></thead><tbody>'+rowsTema+'</tbody></table></div></div>'
    + '<div class="card mb16"><h3 class="mb8">Por subtema</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Subtema</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>'+rowsSubtema+'</tbody></table></div></div>'
    + '<div class="card mb16"><h3 class="mb8">Desempenho em flashcards</h3><div class="grid grid-3">'
    +   '<div class="stat"><span class="num">'+geralFc.total+'</span><span class="lbl">Respondidos</span></div>'
    +   '<div class="stat"><span class="num">'+geralFc.acertos+'</span><span class="lbl">Acertos</span></div>'
    +   '<div class="stat"><span class="num">'+geralFc.percentual+'%</span><span class="lbl">Percentual de acerto</span></div>'
    + '</div></div>'
    + '<div class="card">'
    +   '<span class="eyebrow">Em construção</span><h3 class="mb8">Perfil de Retenção</h3>'
    +   (perfil.suficiente
        ? '<p class="text-soft" style="font-size:13px;">Dados suficientes reunidos ('+perfil.totalPontos+' respostas). A análise por janelas de retenção (1, 3, 7, 14 e 30 dias) ainda está em desenvolvimento.</p>'
        : '<p class="text-soft" style="font-size:13px;">Ainda não há dados suficientes para calcular um perfil de retenção real ('+perfil.totalPontos+' de '+perfil.minimoNecessario+' respostas necessárias). Esta área nunca mostra um perfil inventado — ela só aparece quando houver histórico real de estudo, questões, revisões e flashcards suficiente.</p>')
    + '</div>';
  });
};
function perfRow(label, g){
  return '<tr><td>'+esc(label)+'</td><td>'+g.total+'</td><td>'+g.acertos+'</td><td>'+g.erros+'</td><td>'+g.percentual+'%</td></tr>';
}
const ROTULO_PRIORIDADE = {
  tema_forte:{t:"Tema forte",c:"green"}, tema_fraco:{t:"Tema fraco",c:"red"},
  alta_taxa_erro:{t:"Alta taxa de erro",c:"red"}, precisa_mais_questoes:{t:"Precisa de mais questões",c:"gray"},
  sem_dados:{t:"Sem dados",c:"gray"}
};
function perfRowComRotulos(label, g){
  const badges = (g.rotulos||[]).map(r => { const info = ROTULO_PRIORIDADE[r]||{t:r,c:"gray"}; return '<span class="badge '+info.c+'" style="margin-right:4px;">'+info.t+'</span>'; }).join("");
  return '<tr><td>'+esc(label)+'</td><td>'+g.total+'</td><td>'+g.acertos+'</td><td>'+g.erros+'</td><td>'+g.percentual+'%</td><td>'+badges+'</td></tr>';
}

/* ==========================================================================
   TELA — HELLEN × TAILANE (leitura agregada; nunca edita dados da outra)
   ========================================================================== */
SCREENS.dupla = function(){
  return Promise.all(STATE.cache.users.map(u =>
    Promise.all([DataStore.listAnswers({userId:u.id}), DataStore.listPlanItems(u.id), DataStore.listReviewsDueToday(u.id), DataStore.listGoals(u.id)])
      .then(([answers, plan, revisoes, goals]) => ({
        user: u, stats: Rules.calcPerformanceStats(answers),
        tempo: plan.filter(p=>p.status==="concluido").reduce((s,p)=>s+(p.duracaoRealizadaMin||0),0),
        streak: Rules.calcStreakDias(plan.filter(p=>p.status==="concluido").map(p=>p.data)),
        revisoes: revisoes.length, goals
      }))
  )).then(rows => {
    const cards = rows.map(r => ''
      + '<div class="card">'
      +   '<div class="flex-gap mb12"><span class="avatar">'+initials(r.user.nome)+'</span><h3>'+esc(r.user.nome)+'</h3></div>'
      +   '<div class="grid grid-2">'
      +     '<div class="stat"><span class="num">'+r.stats.total+'</span><span class="lbl">Questões respondidas</span></div>'
      +     '<div class="stat"><span class="num">'+r.stats.percentual+'%</span><span class="lbl">Percentual de acerto</span></div>'

SCREENS.config = function(){
  return loadStructureCache().then(() => {
    const tabDefs = [
      ["materias","Matérias"], ["partes","Partes"], ["temas","Temas"], ["subtemas","Subtemas"],
      ["importar","Importar Estrutura"],
      ["questoes","Questões"], ["flashcards","Flashcards"], ["fontes","Fontes"]

    if(STATE.configTab==="materias"){
      bodyPromise = Promise.resolve(listEditorHTML(STATE.cache.subjects, "subject", "Matéria", null));

      ).join("");
      bodyPromise = Promise.resolve((porParte+diretoNaMateria) || emptyStructHint("partes (ou importe uma estrutura em \"Importar Estrutura\")"));
    } else if(STATE.configTab==="subtemas"){
      bodyPromise = Promise.resolve(STATE.cache.temas.map(t => '<h3 class="mt16 mb8">'+esc(t.nome)+'</h3>'+listEditorHTML(subtemasOf(t.id), "subtema", "Subtema", t.id)).join("") || emptyStructHint("temas"));

function renderCurriculumTree(){
  if(!STATE.cache.subjects.length){
    return '<div class="empty"><p>Nenhuma matéria cadastrada ainda — importe uma estrutura acima ou cadastre manualmente nas abas Matérias/Partes/Temas/Subtemas.</p></div>';
  }
  function temaDetails(t){
    const subtemas = subtemasOf(t.id);
    return '<details><summary>'+esc(t.nome)+' <span class="hint">('+subtemas.length+' subtema(s))</span></summary><ul style="padding-left:18px;margin:6px 0;">'
      + (subtemas.length ? subtemas.map(st => '<li style="font-size:13px;padding:2px 0;">'+esc(st.nome)+'</li>').join("") : '<li class="hint">Nenhum subtema</li>')
      + '</ul></details>';
  }
  const html = STATE.cache.subjects.map(s => {
    const partes = partsOf(s.id);
    const diretos = temasDiretoOf(s.id);
    const totalTemas = partes.reduce((n,p)=>n+temasOf(p.id).length,0) + diretos.length;
    return '<details><summary><strong>'+esc(s.nome)+'</strong> <span class="hint">('+partes.length+' parte(s), '+totalTemas+' tema(s))</span></summary><div style="padding-left:18px;">'
      + (partes.length ? partes.map(p => {
          const temas = temasOf(p.id);
          return '<details><summary>'+esc(p.nome)+' <span class="hint">('+temas.length+' tema(s))</span></summary><div style="padding-left:18px;">'
            + (temas.length ? temas.map(temaDetails).join("") : '<p class="hint">Nenhum tema</p>')
            + '</div></details>';
        }).join("") : '')
      + (diretos.length ? '<p class="hint mt8">Temas direto na matéria (sem parte):</p>'+diretos.map(temaDetails).join("") : '')
      + (!partes.length && !diretos.length ? '<p class="hint">Nenhuma parte ou tema</p>' : '')
      + '</div></details>';
  }).join("");
  return '<div class="tree-view">'+html+'</div>';
}

};
Actions.validateImportJson = function(){
  const box = document.getElementById("import-result");
  const raw = document.getElementById("import-json").value.trim();
  if(!raw){ box.innerHTML = '<div class="badge red">Cole um JSON antes de validar.</div>'; return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ box.innerHTML = '<div class="card tight" style="background:var(--danger-soft);"><strong>JSON inválido</strong><p class="hint mt8">'+esc(e.message)+'</p></div>'; return; }
  const v = validateCurriculumStructure(parsed);
  if(v.ok){
    box.innerHTML = '<div class="card tight" style="background:var(--primary-soft);"><strong>Estrutura válida.</strong> Pronta para importar.</div>';
  } else {
    box.innerHTML = '<div class="card tight" style="background:var(--danger-soft);"><strong>'+v.errors.length+' problema(s) encontrado(s) — nada foi gravado:</strong><ul style="margin:8px 0 0;padding-left:18px;font-size:12.5px;">'+v.errors.map(e=>'<li>'+esc(e)+'</li>').join("")+'</ul></div>';
  }
};
Actions.runImportJson = function(){
  const box = document.getElementById("import-result");
  const raw = document.getElementById("import-json").value.trim();
  if(!raw){ box.innerHTML = '<div class="badge red">Cole um JSON antes de importar.</div>'; return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ box.innerHTML = '<div class="card tight" style="background:var(--danger-soft);"><strong>JSON inválido — nada foi gravado.</strong><p class="hint mt8">'+esc(e.message)+'</p></div>'; return; }
  DataStore.importCurriculum(parsed).then(res => {
    if(!res.ok){
      box.innerHTML = '<div class="card tight" style="background:var(--danger-soft);"><strong>Importação cancelada — '+res.errors.length+' problema(s) na estrutura. Nada foi gravado:</strong><ul style="margin:8px 0 0;padding-left:18px;font-size:12.5px;">'+res.errors.map(e=>'<li>'+esc(e)+'</li>').join("")+'</ul></div>';
      return;
    }
    const r = res.resumo;
    STATE.lastImportMessage = '<div class="card tight" style="background:var(--primary-soft);"><strong>Importação concluída.</strong>'
      + '<p class="hint mt8">Matérias: '+r.materiasCriadas+' criadas, '+r.materiasExistentes+' já existiam · '
      + 'Partes: '+r.partesCriadas+' criadas, '+r.partesExistentes+' já existiam · '
      + 'Temas: '+r.temasCriados+' criados, '+r.temasExistentes+' já existiam · '
      + 'Subtemas: '+r.subtemasCriados+' criados, '+r.subtemasExistentes+' já existiam.</p>'
      + '<p class="hint mt8">Um backup lógico do estado anterior foi guardado — use "Desfazer última importação" se algo não estiver certo.</p></div>';
    loadStructureCache().then(renderScreen);
  });
};
Actions.undoLastImport = function(){
  if(!confirm("Desfazer a última importação? A estrutura curricular volta exatamente ao que era antes dela.")) return;
  DataStore.desfazerUltimaImportacao().then(res => {
    STATE.lastImportMessage = res.ok

      : '<div class="card tight" style="background:var(--danger-soft);"><strong>'+esc(res.motivo)+'</strong></div>';

  const payload = {
    subjectId: fd.get("subjectId"), partId: fd.get("partId"), temaId: fd.get("temaId"), subtemaId: fd.get("subtemaId"),
    enunciado: fd.get("enunciado"), respostaCorreta: fd.get("respostaCorreta"), explicacao: fd.get("explicacao"),
    dificuldade: fd.get("dificuldade")||null, ativa: fd.get("ativa")==="on",
    tipo: fd.get("tipo")
  };
  if(payload.tipo===CONFIG.TIPO_QUESTAO.OFICIAL){
    ["banca","concurso","cargo","ano","prova","numero","fonte"].forEach(f => payload[f] = fd.get(f)||"");
  }
  const id = fd.get("id");
  if(!id) payload.userId = STATE.currentUserId; // quem cadastrou a questão (banco continua compartilhado entre as duas)
  const p = id ? DataStore.updateQuestion(id, payload) : DataStore.createQuestion(payload);
  p.then(() => { modalRoot.innerHTML=""; renderScreen(); });
};
Actions.editQuestion = function(el){ Actions.openQuestionForm(el); };
Actions.deleteQuestion = function(el){
  if(!confirm("Excluir esta questão?")) return;
  DataStore.deleteQuestion(el.dataset.id).then(renderScreen);
};

/* ------------------------- Config: Flashcards (recuperação ativa CERTO/ERRADO) ------------------------- */
function renderFlashcardsConfigTab(){
  if(!STATE.cache.subjects.length) return Promise.resolve(emptyStructHint("matérias, partes e temas"));
  return DataStore.listFlashcards().then(list => {
    const rows = list.length ? list.map(f => ''
      + '<div class="card tight mt8">'
      +   '<div class="flex-between"><div class="flex-gap"><span class="badge blue">Flashcard</span>'+(f.dificuldade?'<span class="badge gray">'+esc(f.dificuldade)+'</span>':'')+'</div><div class="flex-gap"><button class="btn btn-ghost btn-sm" data-action="editFlashcard" data-id="'+f.id+'">'+ic("edit",13)+'</button><button class="btn btn-ghost btn-sm" data-action="deleteFlashcard" data-id="'+f.id+'">'+ic("trash",13)+'</button></div></div>'
      +   '<p class="mt8" style="font-size:13.5px;">'+esc(f.afirmacao)+'</p>'
      +   '<div class="hint">'+esc(nameOf(STATE.cache.subjects,f.subjectId))+' · '+esc(nameOf(STATE.cache.temas,f.temaId))+' · resposta: '+f.respostaCorreta+' · criado em '+fmtDateBR(f.data)+'</div>'
      + '</div>'
    ).join("") : emptyStructHint("nenhum flashcard ainda");
    return rows + '<button class="btn btn-primary btn-sm mt12" data-action="openFlashcardForm">'+ic("plus",13)+' Adicionar flashcard</button>';
  });
}
Actions.openFlashcardForm = function(el){
  const editId = el && el.dataset ? el.dataset.id : null;
  const render = (f) => openModal(''
    + '<button class="modal-close" data-action="closeModal">'+ic("close",16)+'</button>'
    + '<h3>'+(f?"Editar flashcard":"Novo flashcard")+'</h3>'
    + '<form data-form="submitFlashcardForm">'
    +   (f?'<input type="hidden" name="id" value="'+f.id+'">':'')
    +   cascadeSelectsHTML("fcform", f ? {subjectId:f.subjectId, partId:f.partId, temaId:f.temaId, subtemaId:f.subtemaId} : {})
    +   '<div class="field"><label>Afirmação / pergunta</label><textarea name="afirmacao" required>'+esc(f?f.afirmacao:"")+'</textarea></div>'
    +   '<div class="field-row"><div class="field"><label>Resposta correta</label><select name="respostaCorreta" required>'+CONFIG.RESPOSTAS_CERTO_ERRADO.map(o=>'<option value="'+o+'" '+(f&&f.respostaCorreta===o?"selected":"")+'>'+o+'</option>').join("")+'</select></div>'
    +   '<div class="field"><label>Dificuldade</label><select name="dificuldade"><option value="">—</option>'+CONFIG.DIFICULDADE_OPCOES.map(o=>'<option value="'+o+'" '+(f&&f.dificuldade===o?"selected":"")+'>'+o+'</option>').join("")+'</select></div></div>'
    +   '<div class="field"><label>Explicação (opcional)</label><textarea name="explicacao">'+esc(f?f.explicacao:"")+'</textarea></div>'
    +   '<button class="btn btn-primary btn-block mt8" type="submit">Salvar flashcard</button>'
    + '</form>'
  );
  if(editId){ DataStore.getFlashcard(editId).then(render); } else { render(null); }
};
Actions.editFlashcard = function(el){ Actions.openFlashcardForm(el); };
Actions.submitFlashcardForm = function(form){
  const fd = new FormData(form);
  const payload = { subjectId: fd.get("subjectId"), partId: fd.get("partId"), temaId: fd.get("temaId"), subtemaId: fd.get("subtemaId"), afirmacao: fd.get("afirmacao"), respostaCorreta: fd.get("respostaCorreta"), explicacao: fd.get("explicacao"), dificuldade: fd.get("dificuldade")||null };
  const id = fd.get("id");
  if(!id){ payload.userId = STATE.currentUserId; payload.data = todayISO(); } // quem criou e quando (o flashcard em si continua compartilhado, como o banco de questões)
  const p = id ? DataStore.updateFlashcard(id, payload) : DataStore.createFlashcard(payload);
  p.then(() => { modalRoot.innerHTML=""; renderScreen(); });
};
Actions.deleteFlashcard = function(el){
  if(!confirm("Excluir este flashcard?")) return;
  DataStore.deleteFlashcard(el.dataset.id).then(renderScreen);
};

/* ------------------------- Config: Fontes de conteúdo (apenas organizacional) ------------------------- */
function renderFontesConfigTab(){
  return DataStore.listFontes().then(list => {
    const rows = list.length ? list.map(f => ''
      + '<div class="flex-between card tight mt8">'
      +   '<div><strong>'+esc(f.plataforma)+'</strong><div class="hint">'+esc(f.cursoModulo)+' · '+esc(f.referencia)+(f.temaId?' · '+esc(nameOf(STATE.cache.temas,f.temaId)):"")+'</div></div>'
      +   '<button class="btn btn-ghost btn-sm" data-action="deleteFonte" data-id="'+f.id+'">'+ic("trash",13)+'</button>'
      + '</div>'
    ).join("") : '<div class="empty"><p>Nenhuma fonte cadastrada ainda. Fontes são apenas referências organizacionais — o sistema não copia conteúdo protegido de plataformas externas.</p></div>';
    return rows + '<button class="btn btn-primary btn-sm mt12" data-action="openFonteForm">'+ic("plus",13)+' Adicionar fonte</button>';
  });
}
Actions.openFonteForm = function(){
  openModal(''
    + '<button class="modal-close" data-action="closeModal">'+ic("close",16)+'</button>'
    + '<h3>Nova fonte de referência</h3>'
    + '<form data-form="submitFonteForm">'
    +   '<div class="field"><label>Plataforma</label><input type="text" name="plataforma" placeholder="Ex.: Primos Concursos" required></div>'
    +   '<div class="field"><label>Curso / módulo</label><input type="text" name="cursoModulo" placeholder="Ex.: Direito Constitucional — Módulo 2"></div>'
    +   '<div class="field"><label>Referência</label><input type="text" name="referencia" placeholder="Ex.: Aula 5 — Direitos fundamentais"></div>'
    +   '<div class="field"><label>Tema relacionado (opcional)</label><select name="temaId"><option value="">—</option>'+STATE.cache.temas.map(t=>'<option value="'+t.id+'">'+esc(t.nome)+'</option>').join("")+'</select></div>'
    +   '<p class="hint">Apenas uma referência organizacional — não copie ou armazene o conteúdo da aula aqui.</p>'
    +   '<button class="btn btn-primary btn-block mt8" type="submit">Salvar fonte</button>'
    + '</form>'
  );
};
Actions.submitFonteForm = function(form){
  const fd = new FormData(form);
  DataStore.createFonte({ plataforma: fd.get("plataforma"), cursoModulo: fd.get("cursoModulo"), referencia: fd.get("referencia"), temaId: fd.get("temaId")||null }).then(() => { modalRoot.innerHTML=""; renderScreen(); });
};
Actions.deleteFonte = function(el){
  if(!confirm("Excluir esta fonte?")) return;
  DataStore.deleteFonte(el.dataset.id).then(renderScreen);
};
// Ação EXPLÍCITA de reset (nunca disparada automaticamente) — zera todos os dados salvos
// no navegador para as duas usuárias e devolve o sistema ao estado inicial de produção.
Actions.resetAllData = function(){
  if(!confirm("Isso vai apagar TODOS os dados de Hellen e Tailane neste navegador. Confirma?")) return;
  if(!confirm("Tem certeza mesmo? Esta ação não pode ser desfeita.")) return;
  DataStore.resetAll().then(() => {
    STATE.activeQuestionSession = null;
    STATE.activeFlashcardSession = null;
    STATE.currentUserId = null;
    STATE.screen = "dashboard";
    STATE.configTab = "materias";
    STATE.errosTab = "Pendente";
    localStorage.removeItem("inss_last_user");
    return loadStructureCache();
  }).then(() => {
    renderApp();
  });
};

SCREEN_HOOKS.questoes = function(){ afterScreenRenderQuestoes(); };
function afterScreenRenderQuestoes(){
  if(STATE.activeQuestionSession && !STATE.activeQuestionSession.finished){
    if(!STATE.activeQuestionSession.questionStartedAt) STATE.activeQuestionSession.questionStartedAt = Date.now();
    STATE.timerHandle = setInterval(function(){
      const sess = STATE.activeQuestionSession;
      if(!sess || sess.finished) return;
      const restante = sess.endsAt - Date.now();
      const pill = document.getElementById("timer-pill");
      if(restante <= 0){
        clearInterval(STATE.timerHandle);
        finalizarSessaoDeQuestoes(sess).then(renderScreen);
        return;
      }
      if(pill) pill.innerHTML = ic("clock",13)+' '+fmtClock(restante);
    }, 1000);
  }
}

/* ==========================================================================
   BOOTSTRAP
   ========================================================================== */
function boot(){
  Promise.all([DataStore.listUsers(), loadStructureCache()]).then(function(results){
    STATE.cache.users = results[0];
    const last = localStorage.getItem("inss_last_user");
    if(last && STATE.cache.users.find(u=>u.id===last)) STATE.currentUserId = last;
    renderApp();
  }).catch(function(err){
    console.error("[INSS Study] Falha ao iniciar:", err);
    appEl.innerHTML = '<div class="empty"><p>Não foi possível carregar os dados do sistema. Veja o console para detalhes.</p></div>';
  });
}
boot();

// Hook de depuração/teste (somente leitura, não afeta o funcionamento do app)
window.__INSS_DEBUG__ = { STATE, DataStore, Rules, CONFIG, CURRICULO_BASE_INSS };
