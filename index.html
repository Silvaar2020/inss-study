<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INSS Study | Hellen &amp; Tailane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:#F5F7F4;
  --surface:#FFFFFF;
  --surface-alt:#ECF1EC;
  --border:#DCE3DD;
  --border-strong:#C4CFC5;
  --ink:#15221D;
  --ink-soft:#4E5D57;
  --ink-faint:#8A9791;
  --primary:#1F6F5C;
  --primary-dark:#123F33;
  --primary-soft:#E2F0EA;
  --gold:#AD8425;
  --gold-soft:#F4ECD6;
  --danger:#AE402A;
  --danger-soft:#F6E5DF;
  --info:#2C5B82;
  --info-soft:#E3EDF4;
  --radius-lg:16px;
  --radius-md:10px;
  --radius-sm:6px;
  --shadow-sm:0 1px 2px rgba(21,34,29,.06);
  --shadow-md:0 6px 20px rgba(21,34,29,.08);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --sidebar-w:248px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  transition:transform .25s ease;
  z-index:40;
}
.sidebar-brand{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--border);
}
.sidebar-brand .mark{
  font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--primary-dark);letter-spacing:.2px;
}
.sidebar-brand .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}
.sidebar-user{
  margin:14px 16px;padding:12px 14px;background:var(--primary-soft);border-radius:var(--radius-md);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--font-display);font-size:14px;flex-shrink:0;
}
.sidebar-user .who{font-weight:600;font-size:13.5px;color:var(--primary-dark);}
.sidebar-user .streak{font-size:11.5px;color:var(--ink-soft);}
.nav{flex:1;overflow-y:auto;padding:6px 12px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);font-size:13.5px;font-weight:500;cursor:pointer;
  margin-bottom:2px;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-alt);color:var(--ink);}
.nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
.nav-item .ic{width:17px;text-align:center;flex-shrink:0;font-size:14px;}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--border);}
.btn-link{
  background:none;border:none;color:var(--ink-faint);font-size:12.5px;cursor:pointer;padding:4px 0;
}
.btn-link:hover{color:var(--danger);}

.main{
  margin-left:var(--sidebar-w);
  flex:1;min-width:0;
  display:flex;flex-direction:column;
}
.topbar{
  display:none;
  align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.topbar .mark{font-family:var(--font-display);font-weight:700;color:var(--primary-dark);}
.hamburger{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);width:36px;height:36px;font-size:16px;cursor:pointer;}
.content{padding:28px 32px 80px;max-width:1180px;width:100%;}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,25,20,.35);z-index:35;}
.overlay.show{display:block;}

@media (max-width: 900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .topbar{display:flex;}
  .content{padding:18px 16px 90px;}
}

/* ==========================================================================
   PRIMITIVES
   ========================================================================== */
.page-head{margin-bottom:22px;}
.page-head h1{font-size:24px;}
.page-head .desc{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--primary);
  margin-bottom:6px;display:block;
}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card.tight{padding:16px;}
.card h3{font-size:15px;}
.card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}

.stat{display:flex;flex-direction:column;gap:4px;}
.stat .num{font-family:var(--font-mono);font-size:26px;font-weight:600;color:var(--primary-dark);}
.stat .lbl{font-size:12px;color:var(--ink-soft);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.2px;
}
.badge.green{background:var(--primary-soft);color:var(--primary-dark);}
.badge.gold{background:var(--gold-soft);color:var(--gold);}
.badge.red{background:var(--danger-soft);color:var(--danger);}
.badge.blue{background:var(--info-soft);color:var(--info);}
.badge.gray{background:var(--surface-alt);color:var(--ink-soft);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  border:1px solid transparent;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--ink);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}

.progress{height:8px;background:var(--surface-alt);border-radius:999px;overflow:hidden;}
.progress > span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s ease;}
.progress.gold > span{background:var(--gold);}
.progress.danger > span{background:var(--danger);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.empty{
  text-align:center;padding:34px 20px;color:var(--ink-faint);
}
.empty .ic{font-size:26px;margin-bottom:8px;}
.empty p{font-size:13px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:9px 4px;margin-right:14px;font-size:13.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

.modal-back{position:fixed;inset:0;background:rgba(15,25,20,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal h3{margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-faint);}

.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring-wrap .ring-val{position:absolute;font-family:var(--font-mono);font-weight:600;}

.demo-note{
  display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);color:#7A5D14;
  border-radius:var(--radius-md);padding:10px 13px;font-size:12px;margin-bottom:18px;
}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);font-size:12.5px;cursor:pointer;background:var(--surface);color:var(--ink-soft);
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--primary-dark);padding:20px;}
.login-card{background:var(--surface);border-radius:20px;padding:40px 36px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.login-card .mark{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--primary-dark);}
.login-card .sub{color:var(--ink-soft);font-size:13px;margin:6px 0 26px;}
.user-pick{display:flex;flex-direction:column;gap:10px;}
.user-btn{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-md);
  border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;text-align:left;
}
.user-btn:hover{border-color:var(--primary);background:var(--primary-soft);}

.qcard .alt{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border-strong);
  border-radius:var(--radius-md);margin-bottom:9px;cursor:pointer;font-size:13.5px;
}
.qcard .alt:hover{border-color:var(--primary);}
.qcard .alt.selected{border-color:var(--primary);background:var(--primary-soft);}
.qcard .alt.correct{border-color:var(--primary);background:var(--primary-soft);}
.qcard .alt.wrong{border-color:var(--danger);background:var(--danger-soft);}
.qcard .alt .letter{
  width:22px;height:22px;border-radius:50%;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;flex-shrink:0;
}

.timer-pill{
  font-family:var(--font-mono);font-weight:600;font-size:13px;background:var(--surface-alt);
  padding:5px 12px;border-radius:999px;color:var(--ink-soft);
}

.mini-cal{display:flex;gap:6px;}
.mini-cal .d{width:26px;height:26px;border-radius:6px;background:var(--surface-alt);}
.mini-cal .d.done{background:var(--primary);}

.hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.tree-view details{margin:4px 0;}
.tree-view summary{cursor:pointer;font-size:13.5px;padding:6px 8px;border-radius:var(--radius-sm);list-style:revert;}
.tree-view summary:hover{background:var(--surface-alt);}
.tree-view details[open] > summary{color:var(--primary-dark);font-weight:600;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.text-danger{color:var(--danger);}
.text-soft{color:var(--ink-soft);}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mb8{margin-bottom:8px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.flex-gap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==========================================================================
   CAMADA 1 — CONFIG
   Constantes de negócio isoladas para poderem ser editadas sem tocar em
   telas ou regras.
   ========================================================================== */
const CONFIG = {
  MOTIVOS_ERRO: [
    "Não sabia o conteúdo",
    "Esqueci",
    "Confundi conceitos",
    "Interpretei errado",
    "Falta de atenção",
    "Chute",
    "Dúvida entre CERTO e ERRADO",
    "Outro"
  ],
  STATUS_ERRO: ["Pendente", "Revisado", "Superado"],
  // Regra definitiva: 1h30 (90min) de conteúdo + 30min de questões = 2h por matéria.
  DURACAO_CONTEUDO_MIN: 90,
  DURACAO_QUESTOES_MIN: 30,
  APP_NAME: "INSS Study",
  APP_TAGLINE: "Hellen & Tailane",

  // Formato definitivo de resposta em todo o sistema (banco de questões, sessões,
  // revisões, caderno de erros, simulados e questões futuras de IA). Estrutural —
  // não existe mais formato de múltipla escolha (A/B/C/D) em nenhuma parte do app.
  RESPOSTAS_CERTO_ERRADO: ["CERTO", "ERRADO"],

  DIFICULDADE_OPCOES: ["Fácil", "Média", "Difícil"],

  // Tipo de uma questão (campo "tipo" no modelo de dados): nunca uma questão
  // gerada por IA pode ser exibida como se fosse oficial — a UI sempre respeita este campo.
  TIPO_QUESTAO: { OFICIAL: "oficial", IA: "ia" },
  ROTULO_TIPO_QUESTAO: { oficial: "Questão oficial", ia: "GERADA POR IA" },

  // Status possíveis de um item do plano de estudos — preparados para permitir,
  // futuramente, redistribuição automática de sessões perdidas (sem lógica de
  // calendário automática implementada ainda nesta etapa).
  STATUS_PLANO: ["planejado", "iniciado", "pausado", "concluido", "perdido", "reagendado", "cancelado"],
  ROTULO_STATUS_PLANO: {
    planejado: "Planejada", iniciado: "Em andamento", pausado: "Pausada", concluido: "Concluída",
    perdido: "Perdida", reagendado: "Reagendada", cancelado: "Cancelada"
  },

  // Classificação estrutural do estado de um conteúdo (tema/subtema) usada pela
  // camada Rules — hoje calculada de forma simples, preparada para ficar mais
  // sofisticada quando houver dados reais suficientes (revisões, flashcards, etc.).
  ESTADOS_RETENCAO: ["novo", "estudado", "revisao_pendente", "revisao_concluida", "baixa_retencao", "dominado", "precisa_reforco"],

  // Classificação da dificuldade de um erro no Caderno de Erros (item 9 do escopo)
  CLASSIFICACAO_ERRO: {
    ERRO_ISOLADO: "erro_isolado", DIFICULDADE_RECORRENTE: "dificuldade_recorrente",
    BAIXA_RETENCAO: "baixa_retencao", DOMINIO: "dominio"
  },
  ROTULO_CLASSIFICACAO_ERRO: {
    erro_isolado: "Erro isolado", dificuldade_recorrente: "Dificuldade recorrente",
    baixa_retencao: "Baixa retenção", dominio: "Domínio"
  },

  // ---------- Central de Dúvidas e Reforço ----------
  DUVIDA_STATUS: ["aberta", "em_estudo", "aguardando_teste", "resolvida", "precisa_reforco"],
  ROTULO_DUVIDA_STATUS: {
    aberta: "Aberta", em_estudo: "Em estudo", aguardando_teste: "Aguardando teste",
    resolvida: "Resolvida", precisa_reforco: "Precisa de reforço"
  },
  DUVIDA_PRIORIDADE: ["normal", "importante"],
  DUVIDA_ORIGEM: ["Durante uma aula", "Durante a leitura", "Durante uma revisão", "Ao resolver uma questão", "Durante um flashcard", "Outro"],
  DUVIDA_FONTE_TIPOS: ["Gemini", "Google / Google AI", "Claude", "Plataforma de estudos", "Apostila", "Professor", "Outra IA", "Outra fonte"],
  DUVIDA_COMPREENSAO: ["resolvi", "parcial", "nao_entendi"],
  ROTULO_DUVIDA_COMPREENSAO: {
    resolvi: "🟢 Resolvi minha dúvida", parcial: "🟡 Entendi parcialmente", nao_entendi: "🔴 Ainda não entendi"
  }
};

/* ==========================================================================
   CAMADA 2 — ADAPTADOR DE ARMAZENAMENTO (uso interno do DataStore apenas)
   --------------------------------------------------------------------------
   NENHUMA TELA PODE CHAMAR ISTO DIRETAMENTE. Só o DataStore (camada 3) fala
   com este adaptador. Isso existe para que, no futuro, LocalAdapter possa
   ser trocado por um RemoteAdapter (API/banco online) mantendo a mesma
   assinatura de métodos — sem reescrever telas nem regras de negócio.

   IMPORTANTE: localStorage aqui funciona apenas como CACHE/FALLBACK de
   demonstração dentro deste único navegador. Ele NÃO é um banco de dados e
   NÃO sincroniza Hellen e Tailane entre dispositivos diferentes. Cada
   navegador/dispositivo terá sua própria cópia local dos dados.
   ========================================================================== */
const LocalAdapter = (function(){
  // Chave versionada: ao mudar de versão, o sistema NUNCA lê dados de uma
  // chave antiga automaticamente — ele simplesmente não a encontra e parte
  // do estado vazio. Isso evita que dados de uma versão anterior (ex.: uma
  // build com dados demonstrativos) apareçam como se fossem o estado real.
  const CACHE_KEY = "inss_study_production_v1";
  let memory = null; // fonte de verdade em memória durante a sessão atual

  function loadFromCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      console.warn("[LocalAdapter] cache local indisponível ou corrompida:", e);
      return null;
    }
  }
  function saveToCache(data){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
    catch(e){ console.warn("[LocalAdapter] não foi possível salvar cache local:", e); }
  }

  return {
    // Carrega o estado inicial: tenta cache local da versão atual; se não existir
    // (primeira vez nesta versão, ou versão anterior com outra chave), usa o
    // estado informado (produção: sempre vazio — ver buildEmptyState()).
    init(fallbackState){
      memory = loadFromCache() || JSON.parse(JSON.stringify(fallbackState));
      saveToCache(memory);
      return Promise.resolve(memory);
    },
    // Leitura/gravação sempre passam por aqui — ponto único de troca futura por chamadas de API
    read(){
      return Promise.resolve(memory);
    },
    write(mutatorFn){
      mutatorFn(memory);
      saveToCache(memory);
      return Promise.resolve(memory);
    },
    // Ação EXPLÍCITA de reset — só é chamada quando a usuária pede, nunca automaticamente.
    resetToEmpty(emptyState){
      memory = JSON.parse(JSON.stringify(emptyState));
      saveToCache(memory);
      return Promise.resolve(memory);
    },
    isSharedBackend(){
      // Sinaliza claramente para a UI que, nesta v1, não há backend compartilhado real.
      return false;
    }
  };
})();

/* Ponto de extensão futuro (não implementado nesta v1):
   const RemoteAdapter = { init, read, write, isSharedBackend } -> mesma assinatura,
   porém lendo/gravando via fetch() em uma API real. Ao trocar, basta apontar
   DataStore para RemoteAdapter em vez de LocalAdapter — nada mais muda. */

/* ==========================================================================
   ESTADO INICIAL DE PRODUÇÃO — usado de fato no boot() do sistema.
   --------------------------------------------------------------------------
   Contém SOMENTE as duas usuárias reais (Hellen e Tailane). Nenhuma matéria,
   parte, tema, subtema, questão, plano, sessão, resposta, erro, revisão ou
   meta é pré-cadastrada. Tudo começa zerado e é criado pelas próprias
   usuárias a partir das telas do sistema.
   ========================================================================== */
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

function buildEmptyState(){
  return {
    users: [
      { id: "u_hellen", nome: "Hellen" },
      { id: "u_tailane", nome: "Tailane" }
    ],
    subjects: [], parts: [], temas: [], subtemas: [],
    questions: [], planItems: [], qSessions: [], answers: [], errorEntries: [], goals: [],
    flashcards: [], flashcardAnswers: [], fontes: [],
    // Central de Dúvidas e Reforço — preparadas, mas vazias:
    duvidas: [], duvidaFontes: [], duvidaMensagens: [], duvidaTestes: [],
    // Motor de revisões por conteúdo (tema/subtema) — preparado, mas vazio:
    revisoes: []
  };
}

/* ==========================================================================
   SEED / DADOS DEMONSTRATIVOS — SOMENTE PARA TESTES INTERNOS DE CÓDIGO.
   --------------------------------------------------------------------------
   IMPORTANTE: esta função existe apenas como apoio a testes automatizados de
   desenvolvimento (ex.: exercitar telas com dados de exemplo). Ela NUNCA é
   chamada pelo boot() da aplicação e NUNCA é carregada automaticamente para
   as usuárias reais. As matérias e questões aqui NÃO representam o edital
