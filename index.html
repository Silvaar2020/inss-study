/* ==========================================================================
   IMPORTAÇÃO DE ESTRUTURA CURRICULAR — validação (função pura)
   --------------------------------------------------------------------------
   Não acessa DataStore nem Adapter. Apenas confere o formato do objeto antes
   de qualquer gravação. Formato aceito (dois formatos, podem coexistir):

   A) Com divisão em partes:
      { materias: [ { nome, partes: [ { nome, temas: [ TEMA, ... ] } ] } ] }

   B) Sem divisão em partes (quando a fonte não tem "Parte 1", "Parte 2" etc.):
      { materias: [ { nome, temas: [ TEMA, ... ] } ] }

   TEMA pode ser um texto simples ("Interpretação de Texto") ou um objeto
   { nome, subtemas: [ ... ] }. O importador NUNCA inventa uma parte para
   encaixar o formato B — os temas ficam ligados direto à matéria (partId nulo).
   partes/temas/subtemas são opcionais em cada nível. Retorna
   { ok:boolean, errors:string[] }. Se ok é false, NADA deve ser gravado.
   ========================================================================== */
function validateTemaItem(tema, path, errors){
  const nomeValido = (v) => typeof v === "string" && v.trim().length > 0;
  if(typeof tema === "string"){
    if(!nomeValido(tema)) errors.push(path+": tema inválido (texto vazio).");
    return;
  }
  if(!tema || typeof tema !== "object"){ errors.push(path+": item inválido (esperado texto ou objeto)."); return; }
  if(!nomeValido(tema.nome)) errors.push(path+".nome: obrigatório e não pode ser vazio.");
  if(tema.subtemas !== undefined && !Array.isArray(tema.subtemas)){ errors.push(path+".subtemas: precisa ser uma lista."); return; }
  (tema.subtemas||[]).forEach((sub, si) => {
    const sPath = path+".subtemas["+si+"]";
    const subNome = typeof sub === "string" ? sub : (sub && typeof sub === "object" ? sub.nome : null);
    if(!nomeValido(subNome)) errors.push(sPath+": subtema inválido (esperado texto ou {nome} não vazio).");
  });
}
function validateCurriculumStructure(struct){
  const errors = [];
  const nomeValido = (v) => typeof v === "string" && v.trim().length > 0;

  if(!struct || typeof struct !== "object" || Array.isArray(struct)){
    return { ok:false, errors:["A estrutura precisa ser um objeto com a chave 'materias'."] };
  }
  if(!Array.isArray(struct.materias)){
    return { ok:false, errors:["'materias' precisa ser uma lista (array)."] };
  }
  struct.materias.forEach((materia, mi) => {
    const mPath = "materias["+mi+"]";
    if(!materia || typeof materia !== "object"){ errors.push(mPath+": item inválido (esperado objeto)."); return; }
    if(!nomeValido(materia.nome)) errors.push(mPath+".nome: obrigatório e não pode ser vazio.");

    if(materia.partes !== undefined && !Array.isArray(materia.partes)){ errors.push(mPath+".partes: precisa ser uma lista."); }
    else (materia.partes||[]).forEach((parte, pi) => {
      const pPath = mPath+".partes["+pi+"]";
      if(!parte || typeof parte !== "object"){ errors.push(pPath+": item inválido (esperado objeto)."); return; }
      if(!nomeValido(parte.nome)) errors.push(pPath+".nome: obrigatório e não pode ser vazio.");
      if(parte.temas !== undefined && !Array.isArray(parte.temas)){ errors.push(pPath+".temas: precisa ser uma lista."); return; }
      (parte.temas||[]).forEach((tema, ti) => validateTemaItem(tema, pPath+".temas["+ti+"]", errors));
    });

    // Formato B — temas ligados direto à matéria, sem parte
    if(materia.temas !== undefined && !Array.isArray(materia.temas)){ errors.push(mPath+".temas: precisa ser uma lista."); }
    else (materia.temas||[]).forEach((tema, ti) => validateTemaItem(tema, mPath+".temas["+ti+"]", errors));
  });
  return { ok: errors.length===0, errors };
}
function normalizeNome(nome){ return String(nome||"").trim().toLowerCase(); }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function addDiasISO(iso, dias){ const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+dias); return d.toISOString().slice(0,10); }
function encontrarRevisao(d, userId, subjectId, temaId, subtemaId){
  return d.revisoes.find(r => r.userId===userId && r.subjectId===subjectId && r.temaId===temaId && (r.subtemaId||null)===(subtemaId||null));
}
// Cria (se não existir) ou apenas devolve a revisão de um conteúdo já estudado.
// Não reagenda uma revisão já em andamento — só garante que o registro exista.
function upsertRevisaoEstudoSync(d, {userId, subjectId, partId, temaId, subtemaId, grupoId}){
  let r = encontrarRevisao(d, userId, subjectId, temaId, subtemaId);
  if(!r){
    const hoje = hojeISO();
    r = {
      id: uid("rev"), userId, subjectId, partId: partId||null, temaId, subtemaId: subtemaId||null,
      dataEstudoOriginal: hoje, grupoId: grupoId||null, estado: "estudado",
      intervaloDias: 1, streakAcertos: 0, proximaRevisaoData: addDiasISO(hoje, 1),
      desempenhoQuestoes: { total:0, acertos:0, erros:0 }, desempenhoFlashcards: { total:0, acertos:0, erros:0 },
      historico: [{ data: hoje, metodo:"estudo", evento:"Conteúdo estudado" }]
    };
    d.revisoes.push(r);
  }
  return r;
}
// Chamado quando um erro é registrado — prioriza a revisão daquele conteúdo (reagenda para logo).
function upsertRevisaoBaixaRetencaoSync(d, {userId, subjectId, partId, temaId, subtemaId}){
  let r = encontrarRevisao(d, userId, subjectId, temaId, subtemaId);
  const hoje = hojeISO();
  if(!r){
    r = {
      id: uid("rev"), userId, subjectId, partId: partId||null, temaId, subtemaId: subtemaId||null,
      dataEstudoOriginal: hoje, grupoId: null, estado: "baixa_retencao",
      intervaloDias: 0, streakAcertos: 0, proximaRevisaoData: hoje,
      desempenhoQuestoes: { total:0, acertos:0, erros:0 }, desempenhoFlashcards: { total:0, acertos:0, erros:0 },
      historico: []
    };
    d.revisoes.push(r);
  }
  const next = Rules.calcNextReview({ resultado:"erro", intervaloAnterior:r.intervaloDias, streakAcertos:0 });
  r.estado = "baixa_retencao"; r.intervaloDias = next.intervaloDias; r.streakAcertos = 0; r.proximaRevisaoData = next.proximaData;
  r.historico.push({ data: hoje, metodo:"erro_questao", evento:"Erro registrado — revisão priorizada" });
  return r;
}

/* ==========================================================================
   CAMADA 3 — DATASTORE (abstração obrigatória de dados)
   --------------------------------------------------------------------------
   REGRA DE OURO: nenhuma tela e nenhuma regra de negócio acessa localStorage
   ou os objetos internos diretamente. Tudo passa por aqui. Todos os métodos
   retornam Promise propositalmente — mesmo sendo síncronos por baixo nesta
   v1 — para que, no futuro, o LocalAdapter seja trocado por um adaptador
   remoto (API/banco compartilhado real) SEM alterar nenhuma tela ou regra.
   ========================================================================== */
const DataStore = (function(){
  let ready = LocalAdapter.init(buildEmptyState());
  let ultimoBackupImportacao = null; // backup lógico (cópia profunda) da estrutura acadêmica antes da última importação

  function withData(fn){
    return ready.then(() => LocalAdapter.read()).then(fn);
  }
  function mutate(fn){
    return ready.then(() => LocalAdapter.write(fn));
  }

  return {
    isSharedBackend: () => LocalAdapter.isSharedBackend(),

    // ---------- Usuários ----------
    listUsers: () => withData(d => d.users.slice()),
    getUser: (id) => withData(d => d.users.find(u=>u.id===id) || null),

    // ---------- Estrutura acadêmica ----------
    listSubjects: () => withData(d => d.subjects.slice().sort((a,b)=>a.ordem-b.ordem)),
    listParts: (subjectId) => withData(d => d.parts.filter(p=>!subjectId||p.subjectId===subjectId).sort((a,b)=>a.ordem-b.ordem)),
    listTemas: (partId) => withData(d => d.temas.filter(t=>!partId||t.partId===partId).sort((a,b)=>a.ordem-b.ordem)),
    listSubtemas: (temaId) => withData(d => d.subtemas.filter(s=>!temaId||s.temaId===temaId).sort((a,b)=>a.ordem-b.ordem)),

    createSubject: (nome) => mutate(d => d.subjects.push({id:uid("sub"), nome, ordem: d.subjects.length+1})),
    updateSubject: (id, patch) => mutate(d => Object.assign(d.subjects.find(s=>s.id===id), patch)),
    deleteSubject: (id) => mutate(d => {
      d.subjects = d.subjects.filter(s=>s.id!==id);
      const partsToRemove = d.parts.filter(p=>p.subjectId===id).map(p=>p.id);
      d.parts = d.parts.filter(p=>p.subjectId!==id);
      // Remove tanto os temas que pertenciam às partes removidas quanto os temas
      // ligados direto à matéria (sem parte — ver DataStore.importCurriculum).
      const temasToRemove = d.temas.filter(t=>partsToRemove.includes(t.partId) || (!t.partId && t.subjectId===id)).map(t=>t.id);
      d.temas = d.temas.filter(t=>!temasToRemove.includes(t.id));
      d.subtemas = d.subtemas.filter(s=>!temasToRemove.includes(s.temaId));
    }),

    createPart: (subjectId, nome) => mutate(d => d.parts.push({id:uid("part"), subjectId, nome, ordem: d.parts.filter(p=>p.subjectId===subjectId).length+1})),
    updatePart: (id, patch) => mutate(d => Object.assign(d.parts.find(p=>p.id===id), patch)),
    deletePart: (id) => mutate(d => {
      d.parts = d.parts.filter(p=>p.id!==id);
      const temasToRemove = d.temas.filter(t=>t.partId===id).map(t=>t.id);
      d.temas = d.temas.filter(t=>t.partId!==id);
      d.subtemas = d.subtemas.filter(s=>!temasToRemove.includes(s.temaId));
    }),

    createTema: (partId, nome) => mutate(d => d.temas.push({id:uid("tema"), partId, nome, ordem: d.temas.filter(t=>t.partId===partId).length+1})),
    updateTema: (id, patch) => mutate(d => Object.assign(d.temas.find(t=>t.id===id), patch)),
    deleteTema: (id) => mutate(d => {
      d.temas = d.temas.filter(t=>t.id!==id);
      d.subtemas = d.subtemas.filter(s=>s.temaId!==id);
    }),

    createSubtema: (temaId, nome) => mutate(d => d.subtemas.push({id:uid("subtema"), temaId, nome, ordem: d.subtemas.filter(s=>s.temaId===temaId).length+1})),
    updateSubtema: (id, patch) => mutate(d => Object.assign(d.subtemas.find(s=>s.id===id), patch)),
    deleteSubtema: (id) => mutate(d => { d.subtemas = d.subtemas.filter(s=>s.id!==id); }),

    // ---------- Importação em massa da estrutura curricular ----------
    // Transacional do ponto de vista da aplicação: TODA a validação (formato +
    // cálculo de duplicados) acontece antes de qualquer escrita, usando uma
    // leitura somente-consulta dos dados atuais. A gravação em si é UMA única
    // chamada a mutate() que só faz pushes simples — não há como ela falhar
    // no meio do caminho, então nunca existe um estado "parcialmente importado".
    // Duplicados (mesmo nome, mesmo pai, comparação sem acento de caixa/espaços
    // nas pontas) nunca são recriados: o item existente é reaproveisado (seu id
    // é usado para pendurar os filhos novos) — nada é removido ou sobrescrito.
    // Aceita dois formatos por matéria: com "partes" (materia.partes[].temas[])
    // OU sem partes, com "temas" ligados direto à matéria (materia.temas[]) —
    // usado quando a fonte não tem uma divisão explícita em partes. O importador
    // nunca inventa uma parte "fake" só para encaixar o formato de 4 níveis.
    // Antes de gravar, um backup lógico (cópia profunda) do estado estrutural
    // atual é guardado em memória — dá para desfazer com DataStore.desfazerUltimaImportacao().
    importCurriculum: (struct) => {
      const validacao = validateCurriculumStructure(struct);
      if(!validacao.ok) return Promise.resolve({ ok:false, errors: validacao.errors });

      return withData(d => ({ subjects:d.subjects.slice(), parts:d.parts.slice(), temas:d.temas.slice(), subtemas:d.subtemas.slice() })).then(atual => {
        // Backup lógico do estado ANTES da importação (cópia profunda) — permite desfazer.
        ultimoBackupImportacao = JSON.parse(JSON.stringify(atual));

        const novosSubjects = [], novosParts = [], novosTemas = [], novosSubtemas = [];
        const contagem = { materiasCriadas:0, materiasExistentes:0, partesCriadas:0, partesExistentes:0, temasCriados:0, temasExistentes:0, subtemasCriados:0, subtemasExistentes:0 };

        function acharOuCriarSubject(nome){
          const existente = atual.subjects.concat(novosSubjects).find(s => normalizeNome(s.nome)===normalizeNome(nome));
          if(existente){ contagem.materiasExistentes++; return existente.id; }
          const novo = { id: uid("sub"), nome: nome.trim(), ordem: atual.subjects.length+novosSubjects.length+1 };
          novosSubjects.push(novo); contagem.materiasCriadas++;
          return novo.id;
        }
        function acharOuCriarPart(subjectId, nome){
          const existente = atual.parts.concat(novosParts).find(p => p.subjectId===subjectId && normalizeNome(p.nome)===normalizeNome(nome));
          if(existente){ contagem.partesExistentes++; return existente.id; }
          const novo = { id: uid("part"), subjectId, nome: nome.trim(), ordem: atual.parts.concat(novosParts).filter(p=>p.subjectId===subjectId).length+1 };
          novosParts.push(novo); contagem.partesCriadas++;
          return novo.id;
        }
        // partId null = tema ligado direto à matéria (sem parte). A busca de duplicado
        // é sempre escopada ao mesmo pai (mesma parte, OU mesma matéria quando não há parte).
        function acharOuCriarTema(partId, subjectId, nome){
          const existente = atual.temas.concat(novosTemas).find(t => (t.partId||null)===(partId||null) && (t.subjectId||null)===(subjectId||null) && normalizeNome(t.nome)===normalizeNome(nome));
          if(existente){ contagem.temasExistentes++; return existente.id; }
          const escopo = partId
            ? atual.temas.concat(novosTemas).filter(t=>t.partId===partId)
            : atual.temas.concat(novosTemas).filter(t=>!t.partId && t.subjectId===subjectId);
          const novo = { id: uid("tema"), partId: partId||null, subjectId: subjectId||null, nome: nome.trim(), ordem: escopo.length+1 };
          novosTemas.push(novo); contagem.temasCriados++;
          return novo.id;
        }
        function acharOuCriarSubtema(temaId, nome){
          const existente = atual.subtemas.concat(novosSubtemas).find(s => s.temaId===temaId && normalizeNome(s.nome)===normalizeNome(nome));
          if(existente){ contagem.subtemasExistentes++; return; }
          const novo = { id: uid("subtema"), temaId, nome: nome.trim(), ordem: atual.subtemas.concat(novosSubtemas).filter(s=>s.temaId===temaId).length+1 };
          novosSubtemas.push(novo); contagem.subtemasCriados++;
        }
        function processarTemaItem(tema, partId, subjectId){
          const nome = typeof tema === "string" ? tema : tema.nome;
          const temaId = acharOuCriarTema(partId, subjectId, nome);
          const subtemas = (typeof tema === "object" && tema.subtemas) ? tema.subtemas : [];
          subtemas.forEach(sub => {
            const subNome = typeof sub === "string" ? sub : sub.nome;
            acharOuCriarSubtema(temaId, subNome);
          });
        }

        (struct.materias||[]).forEach(materia => {
          const subjectId = acharOuCriarSubject(materia.nome);
          (materia.partes||[]).forEach(parte => {
            const partId = acharOuCriarPart(subjectId, parte.nome);
            (parte.temas||[]).forEach(tema => processarTemaItem(tema, partId, null));
          });
          // Formato sem partes — temas ligados direto à matéria
          (materia.temas||[]).forEach(tema => processarTemaItem(tema, null, subjectId));
        });

        // Única escrita — apenas pushes, não pode falhar no meio do caminho.
        return mutate(d => {
          d.subjects.push(...novosSubjects);
          d.parts.push(...novosParts);
          d.temas.push(...novosTemas);
          d.subtemas.push(...novosSubtemas);
        }).then(() => ({ ok:true, resumo: contagem, podeDesfazer:true }));
      });
    },
    // Desfaz a importação mais recente, restaurando exatamente o estado estrutural
    // (matérias/partes/temas/subtemas) capturado no backup lógico feito antes dela.
    // Não existe encadeamento de múltiplos backups — só a última importação pode
    // ser desfeita. Não mexe em nenhum outro dado (questões, planos, dúvidas, etc.).
    desfazerUltimaImportacao: () => {
      if(!ultimoBackupImportacao) return Promise.resolve({ ok:false, motivo:"Não há nenhuma importação recente para desfazer." });
      const backup = ultimoBackupImportacao;
      return mutate(d => {
        d.subjects = backup.subjects; d.parts = backup.parts; d.temas = backup.temas; d.subtemas = backup.subtemas;
      }).then(() => { ultimoBackupImportacao = null; return { ok:true }; });
    },
    temUltimaImportacaoParaDesfazer: () => !!ultimoBackupImportacao,

    // ---------- Plano de estudos ----------
    // Status possíveis: CONFIG.STATUS_PLANO — preparado para futura redistribuição
    // automática de sessões perdidas (a lógica de redistribuição em si ainda não
    // existe; aqui só garantimos que o dado consegue representar cada estado).
    listPlanItems: (userId) => withData(d => d.planItems.filter(p=>p.userId===userId).sort((a,b)=> (a.data+a.horario).localeCompare(b.data+b.horario))),
    createPlanPair: ({userId, subjectId, partId, temaId, subtemaId, data, horario, observacao, fontePlataforma}) => mutate(d => {
      const grupoId = uid("grp");
      const [h,m] = horario.split(":").map(Number);
      const horarioQuestoes = ((h + Math.floor((m+CONFIG.DURACAO_CONTEUDO_MIN)/60)) % 24).toString().padStart(2,"0") + ":" + ((m+CONFIG.DURACAO_CONTEUDO_MIN)%60).toString().padStart(2,"0");
      d.planItems.push({ id:uid("plan"), userId, grupoId, tipo:"conteudo", subjectId, partId, temaId, subtemaId, data, horario, duracaoPlanejadaMin:CONFIG.DURACAO_CONTEUDO_MIN, duracaoRealizadaMin:null, status:"planejado", dataOriginal:null, observacao:observacao||"", fontePlataforma: fontePlataforma||"" });
      d.planItems.push({ id:uid("plan"), userId, grupoId, tipo:"questoes", subjectId, partId, temaId, subtemaId, data, horario:horarioQuestoes, duracaoPlanejadaMin:CONFIG.DURACAO_QUESTOES_MIN, duracaoRealizadaMin:null, status:"planejado", dataOriginal:null, observacao:"", fontePlataforma: fontePlataforma||"" });
    }),
    updatePlanItem: (id, patch) => mutate(d => Object.assign(d.planItems.find(p=>p.id===id), patch)),
    deletePlanItem: (id) => mutate(d => { d.planItems = d.planItems.filter(p=>p.id!==id); }),
    // Reagenda um item para nova data/horário, preservando a data original (útil para a futura redistribuição automática)
    reschedulePlanItem: (id, novaData, novoHorario) => mutate(d => {
      const item = d.planItems.find(p=>p.id===id);
      if(!item) return;
      if(!item.dataOriginal) item.dataOriginal = item.data;
      item.data = novaData; item.horario = novoHorario || item.horario;
      item.status = "reagendado";
    }),

    // ---------- Banco de questões ----------
    // Formato definitivo: CERTO/ERRADO (Cebraspe) em todo o sistema. Cada questão
    // possui tipo "oficial" (com metadados de banca/concurso/etc.) ou "ia"
    // (identificada explicitamente como "GERADA POR IA" — nunca apresentada como oficial).
    // apenasAtivas=true (padrão em sessões de prática) exclui questões marcadas como inativas.
    listQuestions: (filter) => withData(d => d.questions.filter(q =>
      (!filter||!filter.subjectId||q.subjectId===filter.subjectId) &&
      (!filter||!filter.temaId||q.temaId===filter.temaId) &&
      (!filter||!filter.subtemaId||q.subtemaId===filter.subtemaId) &&
      (!filter||!filter.apenasAtivas||q.ativa!==false)
    )),
    getQuestion: (id) => withData(d => d.questions.find(q=>q.id===id)||null),
    createQuestion: (q) => mutate(d => d.questions.push(Object.assign({
      id: uid("q"),
      userId: null, // "quando aplicável" — quem cadastrou a questão; banco de questões é compartilhado, não individual
      tipo: CONFIG.TIPO_QUESTAO.OFICIAL,
      subjectId:null, partId:null, temaId:null, subtemaId:null,
      enunciado:"", respostaCorreta:"CERTO", explicacao:"",
      dificuldade:null, ativa:true,
      banca:"", concurso:"", cargo:"", ano:"", prova:"", numero:"", fonte:""
    }, q))),
    updateQuestion: (id, patch) => mutate(d => Object.assign(d.questions.find(q=>q.id===id), patch)),
    deleteQuestion: (id) => mutate(d => { d.questions = d.questions.filter(q=>q.id!==id); }),

    // ---------- Sessões de questões (por tempo) ----------
    // duvidaId (opcional): quando a sessão nasce do botão "Fazer questões sobre
    // este assunto" dentro de uma dúvida da Central de Dúvidas, o vínculo é
    // preservado até a resposta e, se houver erro, até o Caderno de Erros.
    createQuestionSession: ({userId, subjectId, partId, temaId, subtemaId, duracaoMin, duvidaId}) => mutate(d => {
      const s = { id:uid("qsess"), userId, subjectId, partId, temaId, subtemaId, duvidaId: duvidaId||null, data: new Date().toISOString().slice(0,10), duracaoMin: duracaoMin||CONFIG.DURACAO_QUESTOES_MIN, finalizada:false };
      d.qSessions.push(s);
      return s;
    }).then(() => withData(d => d.qSessions[d.qSessions.length-1])),
    finishQuestionSession: (id) => mutate(d => { const s = d.qSessions.find(s=>s.id===id); if(s) s.finalizada = true; }),
    getQuestionSession: (id) => withData(d => d.qSessions.find(s=>s.id===id)||null),

    // ---------- Respostas (formato CERTO/ERRADO) ----------
    // Se a usuária acerta uma questão que já tinha um erro registrado no Caderno
    // de Erros, isso é contabilizado como "acerto posterior" (não apaga o erro
    // nem cria um novo registro — ver item 8/9 do escopo de Revisões).
    submitAnswer: ({sessionId, userId, questionId, respostaEscolhida, tempoSegundos, duvidaId}) => {
      return withData(d => d.questions.find(q=>q.id===questionId)).then(q => {
        const correta = q.respostaCorreta === respostaEscolhida;
        return mutate(d => {
          const ansId = uid("ans");
          d.answers.push({
            id: ansId, userId, sessionId, questionId, duvidaId: duvidaId||null,
            subjectId:q.subjectId, partId:q.partId, temaId:q.temaId, subtemaId:q.subtemaId,
            respostaEscolhida, respostaCorreta: q.respostaCorreta, correta,
            motivoErro:null, duvida:"", observacao:"", dificuldadePercebida:null,
            tempoSegundos, data: new Date().toISOString().slice(0,10)
          });
          if(correta){
            const entry = d.errorEntries.find(e => e.userId===userId && e.questionId===questionId);
            if(entry){
              entry.quantidadeAcertosPosteriores = (entry.quantidadeAcertosPosteriores||0) + 1;
              entry.tentativas = entry.tentativas || [];
              entry.tentativas.push({ data: new Date().toISOString().slice(0,10), resposta: respostaEscolhida, correta: true });
              entry.ultimaTentativaData = new Date().toISOString().slice(0,10);
              entry.ultimaResposta = respostaEscolhida;
            }
          }
        }).then(d => ({ answerId: d.answers[d.answers.length-1].id, correta, correctAnswer: q.respostaCorreta, explicacao:q.explicacao }));
      });
    },
    // Registra a dificuldade percebida pela usuária para uma resposta já dada (qualquer resultado, certo ou errado)
    setAnswerDifficulty: (answerId, dificuldadePercebida) => mutate(d => {
      const a = d.answers.find(a=>a.id===answerId);
      if(a) a.dificuldadePercebida = dificuldadePercebida;
    }),
    // Chamado quando a resposta está errada — registra motivo/dúvida/observação e ATUALIZA (não duplica) a
    // entrada no Caderno de Erros daquela questão para aquela usuária, incrementando o histórico de tentativas.
    // Também prioriza a revisão do conteúdo correspondente (baixa_retencao) — ver item 11 do escopo.
    registerErrorDetails: ({answerId, motivoErro, duvida, observacao}) => mutate(d => {
      const a = d.answers.find(a=>a.id===answerId);
      Object.assign(a, { motivoErro, duvida: duvida||"", observacao: observacao||"" });
      const hoje = a.data;
      let entry = d.errorEntries.find(e => e.userId===a.userId && e.questionId===a.questionId);
      if(entry){
        entry.quantidadeErros = (entry.quantidadeErros||1) + 1;
        entry.tentativas = entry.tentativas || [];
        entry.tentativas.push({ data: hoje, resposta:a.respostaEscolhida, correta:false });
        entry.ultimaTentativaData = hoje; entry.ultimaResposta = a.respostaEscolhida;
        entry.motivoErro = motivoErro; entry.duvida = duvida||""; entry.observacao = observacao||"";
        entry.status = "Pendente";
      } else {
        const primeira = Rules.calcNextReview({ resultado:"erro" });
        entry = {
          id:uid("err"), userId:a.userId, answerId:a.id, questionId:a.questionId, duvidaId: a.duvidaId||null,
          subjectId:a.subjectId, partId:a.partId, temaId:a.temaId, subtemaId:a.subtemaId,
          respostaEscolhida:a.respostaEscolhida, respostaCorreta:a.respostaCorreta,
          motivoErro, duvida: duvida||"", observacao: observacao||"",
          data:hoje, status:"Pendente",
          intervaloDias: primeira.intervaloDias, streakAcertos: primeira.streakAcertos, proximaRevisaoData: primeira.proximaData,
          quantidadeErros: 1, quantidadeAcertosPosteriores: 0,
          tentativas: [{ data: hoje, resposta:a.respostaEscolhida, correta:false }],
          ultimaTentativaData: hoje, ultimaResposta: a.respostaEscolhida
        };
        d.errorEntries.push(entry);
      }
      upsertRevisaoBaixaRetencaoSync(d, { userId:a.userId, subjectId:a.subjectId, partId:a.partId, temaId:a.temaId, subtemaId:a.subtemaId });
    }),
    listAnswers: (filter) => withData(d => d.answers.filter(a =>
      (!filter||!filter.userId||a.userId===filter.userId) &&
      (!filter||!filter.sessionId||a.sessionId===filter.sessionId)
    )),

    // ---------- Caderno de erros ----------
    // filter: { userId, status, temaId, subtemaId, motivoErro, minErros, baixaRetencao, naoDominadas, dominadas }
    listErrorEntries: (filter) => withData(d => d.errorEntries.filter(e => {
      if(filter && filter.userId && e.userId!==filter.userId) return false;
      if(filter && filter.status && e.status!==filter.status) return false;
      if(filter && filter.temaId && e.temaId!==filter.temaId) return false;
      if(filter && filter.subtemaId && e.subtemaId!==filter.subtemaId) return false;
      if(filter && filter.motivoErro && e.motivoErro!==filter.motivoErro) return false;
      if(filter && filter.minErros && (e.quantidadeErros||1) < filter.minErros) return false;
      if(filter && (filter.baixaRetencao || filter.naoDominadas || filter.dominadas)){
        const classe = Rules.classifyErrorDifficulty(e);
        if(filter.baixaRetencao && classe!=="baixa_retencao") return false;
        if(filter.naoDominadas && classe==="dominio") return false;
        if(filter.dominadas && classe!=="dominio") return false;
      }
      return true;
    }).sort((a,b)=> b.data.localeCompare(a.data))),
    updateErrorEntry: (id, patch) => mutate(d => Object.assign(d.errorEntries.find(e=>e.id===id), patch)),
    // "Onde estou errando mais?" — agrupa por matéria/tema/subtema somando a quantidade real de erros.
    getErrosPorConteudo: (userId) => withData(d => Rules.calcErrosPorConteudo(d.errorEntries.filter(e=>e.userId===userId))),

    // ---------- Revisões (mantidas por compatibilidade — a tela de Revisões agora usa o motor por conteúdo abaixo) ----------
    listReviewsDueToday: (userId) => withData(d => {
      const hoje = new Date().toISOString().slice(0,10);
      return d.errorEntries.filter(e => e.userId===userId && e.status!=="Superado" && e.proximaRevisaoData<=hoje);
    }),
    completeReview: (entryId, resultado) => mutate(d => {
      const e = d.errorEntries.find(e=>e.id===entryId);
      const next = Rules.calcNextReview({ resultado, intervaloAnterior:e.intervaloDias, streakAcertos:e.streakAcertos||0 });
      e.intervaloDias = next.intervaloDias;
      e.streakAcertos = next.streakAcertos;
      e.proximaRevisaoData = next.proximaData;
      e.ultimoResultado = resultado;
      e.status = resultado==="erro" ? "Pendente" : (next.streakAcertos>=3 ? "Superado" : "Revisado");
    }),

    // ---------- Motor de Revisões por conteúdo (tema/subtema) ----------
    // Uma revisão é criada quando um bloco de conteúdo do plano é concluído
    // (ver Actions.submitFinishPlan) ou quando um erro é registrado. Questões e
    // flashcards alimentam desempenho SEPARADO dentro da mesma revisão — nunca
    // são misturados como se fossem a mesma coisa (ver item 3 do escopo).
    getOrCreateRevisao: ({userId, subjectId, partId, temaId, subtemaId, grupoId}) =>
      mutate(d => upsertRevisaoEstudoSync(d, {userId, subjectId, partId, temaId, subtemaId, grupoId}))
        .then(() => withData(d => encontrarRevisao(d, userId, subjectId, temaId, subtemaId))),
    getRevisao: (id) => withData(d => d.revisoes.find(r=>r.id===id)||null),
    listRevisoes: (userId) => withData(d => d.revisoes.filter(r=>r.userId===userId)),
    listRevisoesDueToday: (userId) => withData(d => {
      const hoje = hojeISO();
      return d.revisoes.filter(r => r.userId===userId && r.estado!=="dominado" && r.proximaRevisaoData<=hoje);
    }),
    listRevisoesProximas: (userId) => withData(d => d.revisoes.filter(r => r.userId===userId && r.proximaRevisaoData>hojeISO())),
    listHistoricoRevisoes: (userId) => withData(d => {
      const out = [];
      d.revisoes.filter(r=>r.userId===userId).forEach(r => r.historico.forEach(h => out.push(Object.assign({
        revisaoId:r.id, subjectId:r.subjectId, temaId:r.temaId, subtemaId:r.subtemaId
      }, h))));
      return out.sort((a,b)=>b.data.localeCompare(a.data));
    }),
    // Chamado quando um erro é registrado (ver registerErrorDetails) — exposto também à parte para uso direto se necessário.
    marcarRevisaoBaixaRetencao: ({userId, subjectId, partId, temaId, subtemaId}) => mutate(d => upsertRevisaoBaixaRetencaoSync(d, {userId, subjectId, partId, temaId, subtemaId})),
    // Alimenta o desempenho de QUESTÕES de uma revisão já existente (não cria uma nova — se o conteúdo
    // ainda não foi formalmente estudado via plano, não há o que atualizar; nada é fabricado).
    registrarDesempenhoQuestoesRevisao: ({userId, subjectId, temaId, subtemaId, total, acertos}) => mutate(d => {
      const r = encontrarRevisao(d, userId, subjectId, temaId, subtemaId);
      if(!r || !total) return;
      r.desempenhoQuestoes.total += total; r.desempenhoQuestoes.acertos += acertos; r.desempenhoQuestoes.erros += (total-acertos);
    }),
    registrarDesempenhoFlashcardsRevisao: ({userId, subjectId, temaId, subtemaId, total, acertos}) => mutate(d => {
      const r = encontrarRevisao(d, userId, subjectId, temaId, subtemaId);
      if(!r || !total) return;
      r.desempenhoFlashcards.total += total; r.desempenhoFlashcards.acertos += acertos; r.desempenhoFlashcards.erros += (total-acertos);
    }),
    // Finaliza uma sessão do fluxo "Revisar" (tela de Revisões): calcula o resultado combinado
    // (questões + flashcards respondidos NAQUELA revisão), reagenda a próxima data via Rules.calcNextReview
    // e reclassifica o estado via Rules.classifyContentState — nunca uma lógica paralela.
    finalizarRevisaoAtiva: ({revisaoId, totalQuestoes, acertosQuestoes, totalFlashcards, acertosFlashcards}) => mutate(d => {
      const r = d.revisoes.find(x=>x.id===revisaoId);
      if(!r) return;
      totalQuestoes = totalQuestoes||0; acertosQuestoes = acertosQuestoes||0; totalFlashcards = totalFlashcards||0; acertosFlashcards = acertosFlashcards||0;
      const totalGeral = totalQuestoes + totalFlashcards, acertosGeral = acertosQuestoes + acertosFlashcards;
      const percentual = totalGeral ? Math.round(acertosGeral/totalGeral*100) : null;
      const resultado = percentual===null ? "acerto_normal" : (percentual<50 ? "erro" : (percentual<80 ? "acerto_dificil" : "acerto_normal"));
      const next = Rules.calcNextReview({ resultado, intervaloAnterior:r.intervaloDias, streakAcertos:r.streakAcertos||0 });
      r.desempenhoQuestoes.total += totalQuestoes; r.desempenhoQuestoes.acertos += acertosQuestoes; r.desempenhoQuestoes.erros += (totalQuestoes-acertosQuestoes);
      r.desempenhoFlashcards.total += totalFlashcards; r.desempenhoFlashcards.acertos += acertosFlashcards; r.desempenhoFlashcards.erros += (totalFlashcards-acertosFlashcards);
      const hoje = hojeISO();
      r.intervaloDias = next.intervaloDias; r.streakAcertos = next.streakAcertos; r.proximaRevisaoData = next.proximaData;
      const totalHistoricoGeral = r.desempenhoQuestoes.total + r.desempenhoFlashcards.total;
      const percentualHistorico = totalHistoricoGeral ? Math.round((r.desempenhoQuestoes.acertos+r.desempenhoFlashcards.acertos)/totalHistoricoGeral*100) : 0;
      r.estado = Rules.classifyContentState({ totalRespostas: totalHistoricoGeral, percentualAcerto: percentualHistorico, streakAcertos: next.streakAcertos, temErroPendente:false, temRevisaoPendente:false });
      r.historico.push({
        data: hoje, metodo: (totalQuestoes && totalFlashcards) ? "combinado" : (totalFlashcards ? "flashcards" : "questoes"),
        respondidas: totalGeral, acertos: acertosGeral, percentual, resultado, proximaRevisaoDepois: next.proximaData, estadoResultante: r.estado
      });
    }).then(() => withData(d => d.revisoes.find(x=>x.id===revisaoId))),

    // ---------- Metas ----------
    listGoals: (userId) => withData(d => d.goals.filter(g=>g.userId===userId)),
    setGoal: (userId, tipo, valorAlvo) => mutate(d => {
      let g = d.goals.find(g=>g.userId===userId && g.tipo===tipo);
      if(g) g.valorAlvo = valorAlvo;
      else d.goals.push({id:uid("goal"), userId, tipo, valorAlvo});
    }),

    // ---------- Leitura ampla (para telas de desempenho / dupla) ----------
    _raw: () => withData(d => d), // uso interno de leitura agregada pelas telas de análise; ainda passa pelo DataStore

    // ---------- Flashcards (recuperação ativa CERTO/ERRADO) ----------
    // O resultado de cada resposta de flashcard fica disponível para ser usado
    // futuramente pelo mesmo algoritmo de revisão espaçada (camada Rules) que
    // já trata os erros de questões — essa ligação ainda não é automática nesta etapa.
    listFlashcards: (filter) => withData(d => d.flashcards.filter(f =>
      (!filter||!filter.subjectId||f.subjectId===filter.subjectId) &&
      (!filter||!filter.temaId||f.temaId===filter.temaId) &&
      (!filter||!filter.subtemaId||f.subtemaId===filter.subtemaId)
    )),
    getFlashcard: (id) => withData(d => d.flashcards.find(f=>f.id===id)||null),
    createFlashcard: (f) => mutate(d => d.flashcards.push(Object.assign({
      id: uid("fc"), userId:null, data: new Date().toISOString().slice(0,10),
      subjectId:null, partId:null, temaId:null, subtemaId:null,
      afirmacao:"", respostaCorreta:"CERTO", explicacao:"", dificuldade:null
    }, f))),
    updateFlashcard: (id, patch) => mutate(d => Object.assign(d.flashcards.find(f=>f.id===id), patch)),
    deleteFlashcard: (id) => mutate(d => { d.flashcards = d.flashcards.filter(f=>f.id!==id); }),
    submitFlashcardAnswer: ({userId, flashcardId, respostaEscolhida, dificuldadePercebida}) => {
      return withData(d => d.flashcards.find(f=>f.id===flashcardId)).then(f => {
        const correta = f.respostaCorreta === respostaEscolhida;
        return mutate(d => {
          d.flashcardAnswers.push({
            id: uid("fca"), userId, flashcardId,
            subjectId:f.subjectId, partId:f.partId, temaId:f.temaId, subtemaId:f.subtemaId,
            respostaEscolhida, respostaCorreta: f.respostaCorreta, correta,
            dificuldadePercebida: dificuldadePercebida||null,
            data: new Date().toISOString().slice(0,10)
          });
        }).then(() => ({ correta, correctAnswer: f.respostaCorreta, explicacao: f.explicacao }));
      });
    },
    listFlashcardAnswers: (filter) => withData(d => d.flashcardAnswers.filter(a =>
      (!filter||!filter.userId||a.userId===filter.userId) &&
      (!filter||!filter.flashcardId||a.flashcardId===filter.flashcardId)
    )),

    // ---------- Fontes de conteúdo (apenas organizacional — nunca copia conteúdo protegido) ----------
    // Fonte → Plataforma → Curso/Módulo → Referência, com vínculo opcional a um tema.
    listFontes: (temaId) => withData(d => d.fontes.filter(f=>!temaId||f.temaId===temaId)),
    createFonte: (f) => mutate(d => d.fontes.push(Object.assign({ id: uid("fonte"), plataforma:"", cursoModulo:"", referencia:"", temaId:null }, f))),
    updateFonte: (id, patch) => mutate(d => Object.assign(d.fontes.find(f=>f.id===id), patch)),
    deleteFonte: (id) => mutate(d => { d.fontes = d.fontes.filter(f=>f.id!==id); }),

    // ---------- Central de Dúvidas e Reforço ----------
    // Ciclo: dúvida → fontes consultadas → explicações → avaliação de compreensão
    // → (se necessário) reforço → debate → teste → questões Cebraspe → resultado.
    // Nada aqui chama uma IA de verdade — são apenas os pontos de extensão
    // (gerarReforco / addDuvidaTeste) que uma integração futura vai preencher.

    // Uma dúvida só é visível para: quem criou, OU quem está em compartilhadoCom.
    // Isso é o que garante que uma dúvida privada de Hellen nunca apareça para
    // Tailane a menos que tenha sido explicitamente compartilhada.
    createDuvida: ({userId, subjectId, partId, temaId, subtemaId, titulo, pergunta, contexto, origem, plataformaOrigem, nomeAulaMaterial, observacaoOrigem, prioridade, questionId, respostaUsuarioQuestao, respostaCorretaQuestao, motivoErroOrigem}) => mutate(d => {
      const hoje = new Date().toISOString().slice(0,10);
      d.duvidas.push({
        id: uid("duv"), userId,
        subjectId: subjectId||null, partId: partId||null, temaId: temaId||null, subtemaId: subtemaId||null,
        titulo, pergunta, contexto: contexto||"",
        origem: origem||null, plataformaOrigem: plataformaOrigem||"", nomeAulaMaterial: nomeAulaMaterial||"", observacaoOrigem: observacaoOrigem||"",
        // Vínculo opcional com a questão que originou a dúvida (Banco de Questões → "Tenho dúvida sobre esta questão")
        questionId: questionId||null, respostaUsuarioQuestao: respostaUsuarioQuestao||null, respostaCorretaQuestao: respostaCorretaQuestao||null, motivoErroOrigem: motivoErroOrigem||null,
        dataCriacao: hoje, dataAtualizacao: hoje,
        status: "aberta", prioridade: prioridade||"normal",
        resolvida:false, dataResolucao:null,
        compreensao: null, comentarioCompreensao: "",
        reforcoSolicitado:false, reforcoConteudo:null,
        historicoExplicacoes: [], historicoReforcos: [], historicoQuestoesIA: [],
        criadorId: userId, compartilhadoCom: []
      });
    }).then(() => withData(d => d.duvidas[d.duvidas.length-1])),
    // Cria uma dúvida automaticamente a partir de uma resposta errada no Banco de Questões
    // (botão "Tenho dúvida sobre esta questão"), pré-preenchendo todo o contexto disponível.
    criarDuvidaDeRespostaErrada: ({userId, answerId}) => {
      return withData(d => ({ a: d.answers.find(x=>x.id===answerId) })).then(({a}) => {
        if(!a) return Promise.resolve(null);
        return withData(d => d.questions.find(q=>q.id===a.questionId)).then(q => {
          const hoje = new Date().toISOString().slice(0,10);
          return mutate(d => {
            d.duvidas.push({
              id: uid("duv"), userId,
              subjectId: a.subjectId||null, partId: a.partId||null, temaId: a.temaId||null, subtemaId: a.subtemaId||null,
              titulo: "Dúvida sobre questão" + (q ? " — "+ (q.enunciado||"").slice(0,60) : ""),
              pergunta: "", contexto: q ? q.enunciado : "",
              origem: "Ao resolver uma questão", plataformaOrigem: "", nomeAulaMaterial: "", observacaoOrigem: "",
              questionId: a.questionId, respostaUsuarioQuestao: a.respostaEscolhida, respostaCorretaQuestao: a.respostaCorreta, motivoErroOrigem: a.motivoErro||null,
              dataCriacao: hoje, dataAtualizacao: hoje,
              status: "aberta", prioridade: "normal",
              resolvida:false, dataResolucao:null,
              compreensao: null, comentarioCompreensao: "",
              reforcoSolicitado:false, reforcoConteudo:null,
              historicoExplicacoes: [], historicoReforcos: [], historicoQuestoesIA: [],
              criadorId: userId, compartilhadoCom: []
            });
          }).then(() => withData(d => d.duvidas[d.duvidas.length-1]));
        });
      });
    },
    updateDuvida: (id, patch) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(duv) Object.assign(duv, patch, { dataAtualizacao: new Date().toISOString().slice(0,10) });
    }),
    getDuvida: (id) => withData(d => d.duvidas.find(x=>x.id===id)||null),
    deleteDuvida: (id) => mutate(d => {
      d.duvidas = d.duvidas.filter(x=>x.id!==id);
      d.duvidaFontes = d.duvidaFontes.filter(f=>f.duvidaId!==id);
      d.duvidaMensagens = d.duvidaMensagens.filter(m=>m.duvidaId!==id);
      d.duvidaTestes = d.duvidaTestes.filter(t=>t.duvidaId!==id);
    }),
    // filter: { userId (obrigatório para respeitar isolamento), status, subjectId, temaId, origem, resolvida, apenasProprias, apenasCompartilhadas, periodoInicio, periodoFim }
    listDuvidas: (filter) => withData(d => d.duvidas.filter(x => {
      if(!filter || !filter.userId) return false; // nunca lista sem saber de qual usuária — evita vazar dúvida privada por engano
      const propria = x.userId===filter.userId;
      const compartilhadaComigo = (x.compartilhadoCom||[]).includes(filter.userId);
      if(filter.apenasProprias && !propria) return false;
      if(filter.apenasCompartilhadas && !compartilhadaComigo) return false;
      if(!filter.apenasProprias && !filter.apenasCompartilhadas && !propria && !compartilhadaComigo) return false;
      if(filter.status && x.status!==filter.status) return false;
      if(filter.subjectId && x.subjectId!==filter.subjectId) return false;
      if(filter.temaId && x.temaId!==filter.temaId) return false;
      if(filter.origem && x.origem!==filter.origem) return false;
      if(filter.resolvida!==undefined && x.resolvida!==filter.resolvida) return false;
      if(filter.periodoInicio && x.dataCriacao<filter.periodoInicio) return false;
      if(filter.periodoFim && x.dataCriacao>filter.periodoFim) return false;
      return true;
    }).sort((a,b)=>b.dataAtualizacao.localeCompare(a.dataAtualizacao))),
    getDuvidasByTema: (temaId, userId) => withData(d => d.duvidas.filter(x => x.temaId===temaId && (x.userId===userId || (x.compartilhadoCom||[]).includes(userId)))),

    updateDuvidaStatus: (id, status) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(!duv) return;
      duv.status = status; duv.dataAtualizacao = new Date().toISOString().slice(0,10);
      if(status==="resolvida"){ duv.resolvida = true; duv.dataResolucao = duv.dataAtualizacao; }
    }),
    // "Como está sua compreensão?" — IMPORTANTE: marcar "resolvi" NÃO fecha a dúvida
    // sozinho (não há evidência suficiente só por uma explicação). Isso só move o
    // status para "aguardando_teste"; a usuária (ou uma evidência real de desempenho)
    // é que decide marcar como "resolvida" de fato — ver item 11 do escopo de IA.
    setDuvidaCompreensao: (id, compreensao, comentario) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(!duv) return;
      const hoje = new Date().toISOString().slice(0,10);
      duv.compreensao = compreensao; duv.comentarioCompreensao = comentario||""; duv.dataAtualizacao = hoje;
      if(compreensao==="resolvi"){ duv.status = "aguardando_teste"; }
      else if(compreensao==="parcial" || compreensao==="nao_entendi"){ duv.status="precisa_reforco"; duv.resolvida=false; }
    }),
    // Marca a dúvida como resolvida de fato — ação explícita (manual ou por evidência real
    // futura de desempenho), nunca automática só por causa de uma explicação recebida.
    marcarDuvidaResolvidaComEvidencia: (id, motivoEvidencia) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(!duv) return;
      const hoje = new Date().toISOString().slice(0,10);
      duv.status = "resolvida"; duv.resolvida = true; duv.dataResolucao = hoje; duv.dataAtualizacao = hoje;
      duv.evidenciaResolucao = motivoEvidencia || "Confirmado manualmente pela usuária";
    }),
    // Registra que uma explicação (da IA, quando integrada) foi solicitada para esta dúvida —
    // permite à IA (futuramente) saber que deve variar a estratégia em vez de repetir o mesmo texto.
    registrarTentativaExplicacao: (duvidaId) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(!duv) return;
      duv.historicoExplicacoes = duv.historicoExplicacoes || [];
      duv.historicoExplicacoes.push({ data: new Date().toISOString().slice(0,10), numero: duv.historicoExplicacoes.length+1 });
      duv.dataAtualizacao = new Date().toISOString().slice(0,10);
    }).then(() => withData(d => d.duvidas.find(x=>x.id===duvidaId))),
    registrarTentativaQuestaoIA: (duvidaId) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(!duv) return;
      duv.historicoQuestoesIA = duv.historicoQuestoesIA || [];
      duv.historicoQuestoesIA.push({ data: new Date().toISOString().slice(0,10) });
      duv.dataAtualizacao = new Date().toISOString().slice(0,10);
    }),

    // ---------- Fontes consultadas (Gemini, Google, Claude, apostila, professor, etc.) ----------
    addDuvidaFonte: ({duvidaId, tipo, nome, descricao, conteudo, link}) => mutate(d => {
      d.duvidaFontes.push({ id: uid("duvfonte"), duvidaId, tipo, nome: nome||"", descricao: descricao||"", conteudo: conteudo||"", link: link||"", dataConsulta: new Date().toISOString().slice(0,10) });
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(duv) duv.dataAtualizacao = new Date().toISOString().slice(0,10);
    }),
    listDuvidaFontes: (duvidaId) => withData(d => d.duvidaFontes.filter(f=>f.duvidaId===duvidaId)),
    deleteDuvidaFonte: (id) => mutate(d => { d.duvidaFontes = d.duvidaFontes.filter(f=>f.id!==id); }),

    // ---------- Debate/conversa associada à dúvida ----------
    // tipo "usuario" é o único gerado por esta v1 — "ia" fica pronto para quando
    // houver uma integração real; nenhuma resposta de IA é fabricada aqui.
    addDuvidaMensagem: ({duvidaId, userId, autor, tipo, texto}) => mutate(d => {
      d.duvidaMensagens.push({ id: uid("duvmsg"), duvidaId, userId, autor, tipo: tipo||"usuario", texto, data: new Date().toISOString().slice(0,10) });
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(duv) duv.dataAtualizacao = new Date().toISOString().slice(0,10);
    }),
    listDuvidaMensagens: (duvidaId) => withData(d => d.duvidaMensagens.filter(m=>m.duvidaId===duvidaId)),

    // ---------- Compartilhamento (aprendizagem colaborativa) ----------
    // A dúvida continua pertencendo a quem criou (criadorId nunca muda). Compartilhar
    // só adiciona a outra usuária à lista de quem pode ver/participar — nunca mistura
    // os históricos individuais nem duplica a dúvida.
    shareDuvida: (id, comUserId) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(duv && !duv.compartilhadoCom.includes(comUserId)) duv.compartilhadoCom.push(comUserId);
    }),
    unshareDuvida: (id, comUserId) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===id);
      if(duv) duv.compartilhadoCom = duv.compartilhadoCom.filter(u=>u!==comUserId);
    }),

    // ---------- Reforço (persistência do pedido; o conteúdo real vem da IA quando configurada) ----------
    // Formato estruturado esperado quando a IA responder: oQuePrecisaSaber, comoFunciona,
    // exemplo, pegadinhaProva, comoLembrar, miniVerificacao (6 seções, focadas SOMENTE
    // no ponto de dificuldade — nunca uma aula genérica da matéria inteira).
    gerarReforco: (duvidaId) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(duv){
        duv.reforcoSolicitado = true; duv.dataAtualizacao = new Date().toISOString().slice(0,10);
        duv.historicoReforcos = duv.historicoReforcos || [];
        duv.historicoReforcos.push({ data: duv.dataAtualizacao, numero: duv.historicoReforcos.length+1 });
      }
    }).then(() => withData(d => d.duvidas.find(x=>x.id===duvidaId))),
    // Só é chamado quando a IA REAL respondeu com sucesso (AIService.solicitarReforco ok:true) —
    // nunca preenchido a partir de uma mensagem simulada.
    registrarReforcoConteudo: (duvidaId, conteudo) => mutate(d => {
      const duv = d.duvidas.find(x=>x.id===duvidaId);
      if(duv) duv.reforcoConteudo = conteudo;
    }),

    // ---------- Teste de compreensão (persistência do pedido) ----------
    // Sempre identificado como "Teste de compreensão gerado por IA" — nunca como questão oficial.
    addDuvidaTeste: ({duvidaId, userId}) => mutate(d => {
      d.duvidaTestes.push({ id: uid("duvteste"), duvidaId, userId, perguntas:[], respostas:[], resultado:null, status:"aguardando_geracao_ia", data: new Date().toISOString().slice(0,10) });
    }).then(() => withData(d => d.duvidaTestes[d.duvidaTestes.length-1])),
    // Só é chamado quando a IA REAL respondeu com sucesso — preenche as perguntas de verdade.
    salvarPerguntasTeste: (testeId, perguntas) => mutate(d => {
      const t = d.duvidaTestes.find(x=>x.id===testeId);
      if(t){ t.perguntas = perguntas; t.status = "gerado"; }
    }),
    responderPerguntaTeste: (testeId, indice, respostaUsuario, correta) => mutate(d => {
      const t = d.duvidaTestes.find(x=>x.id===testeId);
      if(!t) return;
      t.respostas = t.respostas || [];
      t.respostas.push({ indice, resposta: respostaUsuario, correta: !!correta, data: new Date().toISOString().slice(0,10) });
      const acertos = t.respostas.filter(r=>r.correta).length;
      t.resultado = { total: t.respostas.length, acertos };
    }),
    listDuvidaTestes: (duvidaId) => withData(d => d.duvidaTestes.filter(t=>t.duvidaId===duvidaId)),

    // ---------- Questões de prática geradas por IA ----------
    // Só cria questões reais no banco (tipo:"ia") quando a IA REAL responder com sucesso.
    // Nunca fabricada localmente — se não houver resposta real, nada é criado.
    criarQuestoesIA: (duvidaId, subjectId, partId, temaId, subtemaId, questoesGeradas) => mutate(d => {
      (questoesGeradas||[]).forEach(q => {
        d.questions.push({
          id: uid("q"), userId: null, tipo: CONFIG.TIPO_QUESTAO.IA,
          subjectId: subjectId||null, partId: partId||null, temaId: temaId||null, subtemaId: subtemaId||null,
          enunciado: q.enunciado || q.pergunta || "", respostaCorreta: q.respostaCorreta==="CERTO"?"CERTO":"ERRADO",
          explicacao: q.explicacao || "", dificuldade: q.dificuldade || null, ativa: true,
          banca:"", concurso:"", cargo:"", ano:"", prova:"", numero:"", fonte:"", duvidaOrigemId: duvidaId
        });
      });
    }).then(() => withData(d => d.questions.filter(q=>q.duvidaOrigemId===duvidaId))),

    // ---------- Reset EXPLÍCITO (não é chamado automaticamente em nenhum boot) ----------
    resetAll: () => { ready = LocalAdapter.resetToEmpty(buildEmptyState()); return ready; }
  };
})();

/* ==========================================================================
   CAMADA 4 — RULES (regras de negócio)
   --------------------------------------------------------------------------
   Isolada de UI e de armazenamento. Recebe dados simples e devolve dados
   simples — pode ser modificada/testada sem tocar em telas ou no DataStore.
   ========================================================================== */
const Rules = {
  /* Algoritmo de repetição espaçada — REGRA INICIAL, feita para ser ajustada.
     resultado: "erro" | "acerto_dificil" | "acerto_normal"
     intervaloAnterior: nº de dias do intervalo anterior (0 se não houver)
     streakAcertos: sequência de acertos consecutivos nesta entrada do caderno */
  calcNextReview({ resultado, intervaloAnterior = 0, streakAcertos = 0 }){
    const hoje = new Date();
    let dias, novoStreak;
    if(resultado === "erro"){
      dias = 1; novoStreak = 0;
    } else if(resultado === "acerto_dificil"){
      dias = 3; novoStreak = 1;
    } else { // acerto_normal
      if(streakAcertos <= 0){
        dias = 7; novoStreak = 1;
      } else {
        // acertos recorrentes aumentam progressivamente o intervalo (teto de 60 dias)
        dias = Math.min(Math.round(7 * Math.pow(1.6, streakAcertos)), 60);
        novoStreak = streakAcertos + 1;
      }
    }
    const proxima = new Date(hoje); proxima.setDate(proxima.getDate() + dias);
    return { intervaloDias: dias, streakAcertos: novoStreak, proximaData: proxima.toISOString().slice(0,10) };
  },


  // Progresso de uma meta simples: valorAtual / valorAlvo, limitado a 100%
  calcGoalProgress(valorAtual, valorAlvo){
    if(!valorAlvo) return 0;
    return Math.max(0, Math.min(100, Math.round((valorAtual / valorAlvo) * 100)));
  },

  // Estatísticas de desempenho a partir de uma lista de respostas
  calcPerformanceStats(answers){
    const total = answers.length;
    const acertos = answers.filter(a=>a.correta).length;
    const erros = total - acertos;
    const percentual = total ? Math.round((acertos/total)*100) : 0;
    const tempoMedio = total ? Math.round(answers.reduce((s,a)=>s+(a.tempoSegundos||0),0)/total) : 0;
    return { total, acertos, erros, percentual, tempoMedioSegundos: tempoMedio };
  },

  // Agrupa respostas por uma chave (subjectId, temaId, etc.) e calcula stats por grupo
  groupPerformanceBy(answers, key){
    const groups = {};
    answers.forEach(a => {
      const k = a[key] || "—";
      if(!groups[k]) groups[k] = [];
      groups[k].push(a);
    });
    return Object.entries(groups).map(([k, list]) => ({ key:k, ...Rules.calcPerformanceStats(list) }));
  },

  // Sequência de dias estudados (streak) a partir de datas de itens de plano concluídos
  calcStreakDias(datasConcluidas){
    const set = new Set(datasConcluidas);
    let streak = 0;
    let cursor = new Date();
    while(true){
      const iso = cursor.toISOString().slice(0,10);
      if(set.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
    }
    return streak;
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — preparado nesta etapa, usado de forma simples por enquanto.
     Classifica o estado de um conteúdo (tema ou subtema) a partir dos dados
     reais já existentes (respostas + entradas do caderno de erros + revisões
     para aquele conteúdo). Não inventa nada: se não há dados, o conteúdo é
     "novo". Os limiares (thresholds) abaixo são o ponto a ajustar quando
     tivermos volume real de uso.
     Retorna um de CONFIG.ESTADOS_RETENCAO. ------------------------------- */
  classifyContentState({ totalRespostas = 0, percentualAcerto = 0, streakAcertos = 0, temErroPendente = false, temRevisaoPendente = false }){
    if(totalRespostas === 0) return "novo";
    if(temErroPendente) return "baixa_retencao";
    if(temRevisaoPendente) return "revisao_pendente";
    if(streakAcertos >= 3 && percentualAcerto >= 80) return "dominado";
    if(percentualAcerto < 50) return "precisa_reforco";
    return streakAcertos > 0 ? "revisao_concluida" : "estudado";
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — "Perfil de Retenção" (ver item 5 do escopo).
     NÃO é um diagnóstico psicológico e NÃO classifica estilo de aprendizagem
     (visual/auditivo/etc.). É só o ponto de entrada onde, futuramente, dados
     reais de desempenho imediato x desempenho após 1/3/7/14/30 dias, número
     de revisões, número de erros, tempo de resposta e dificuldade percebida
     serão cruzados — separadamente para questões e para flashcards (ambos
     alimentam "recuperação", mas são fontes distintas). Enquanto não houver
     volume mínimo de dados reais, retorna explicitamente "insuficiente" — a
     UI nunca deve inventar um perfil.
     dataPoints esperado: array de { diasDesdeEstudo, correta, dificuldadePercebida, origem: "questao"|"flashcard" } */
  calcRetentionProfile(dataPoints){
    const MINIMO_PARA_PERFIL = 20; // ajustável quando definirmos a métrica real
    if(!dataPoints || dataPoints.length < MINIMO_PARA_PERFIL){
      return { suficiente: false, totalPontos: dataPoints ? dataPoints.length : 0, minimoNecessario: MINIMO_PARA_PERFIL };
    }
    // Ponto de extensão futuro: cruzar dataPoints por janela de dias (1,3,7,14,30),
    // separando recuperação em questões de recuperação em flashcards, e calcular
    // queda de percentual de acerto por janela. Não implementado ainda.
    return { suficiente: true, totalPontos: dataPoints.length, porJanelaDias: { 1:null, 3:null, 7:null, 14:null, 30:null } };
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — descreve em texto um padrão de retenção (ex.: "Boa retenção
     imediata, mas queda após 7 dias."). Só existe como ponto de extensão:
     hoje sempre retorna null enquanto calcRetentionProfile() não estiver
     "suficiente" com janelas por dia realmente calculadas — nunca inventa
     uma frase de diagnóstico a partir de dados incompletos. -------------- */
  describeRetentionPattern(perfil){
    if(!perfil || !perfil.suficiente) return null;
    return null; // implementação real fica para quando houver dados reais de janelas por dia
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — prioridade por desempenho (ver item 7 do escopo). Recebe as
     estatísticas já agrupadas por tema (ex.: saída de groupPerformanceBy) e
     classifica cada tema. Não decide nada sozinho sobre o plano — apenas
     produz rótulos que a UI/planejamento poderão usar no futuro. ---------- */
  calcTemaPriority(statsPorTema){
    return (statsPorTema||[]).map(t => {
      const rotulos = [];
      if(t.total === 0) rotulos.push("sem_dados");
      else {
        if(t.percentual >= 80) rotulos.push("tema_forte");
        if(t.percentual > 0 && t.percentual < 50) rotulos.push("tema_fraco");
        if(t.erros >= 3 && t.percentual < 60) rotulos.push("alta_taxa_erro");
        if(t.total < 5) rotulos.push("precisa_mais_questoes");
      }
      return Object.assign({}, t, { rotulos });
    });
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — Central de Dúvidas (ver itens 17 e 18 do escopo). Agrega
     dúvidas reais por tema para futuramente alimentar Desempenho e Perfil de
     Retenção com "temas com mais dúvidas", "temas que mais exigiram reforço",
     etc. Não gera nenhuma conclusão de retenção nem frase de diagnóstico —
     só contagens simples a partir do que existir de fato. Com zero dúvidas,
     devolve uma lista vazia (nunca inventa linhas). --------------------- */
  calcDuvidasStats(duvidas){
    const porTema = {};
    (duvidas||[]).forEach(d => {
      const k = d.temaId || "sem_tema";
      if(!porTema[k]) porTema[k] = { temaId: d.temaId||null, total:0, resolvidas:0, precisaReforco:0 };
      porTema[k].total++;
      if(d.status==="resolvida") porTema[k].resolvidas++;
      if(d.status==="precisa_reforco") porTema[k].precisaReforco++;
    });
    return Object.values(porTema);
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — Caderno de Erros (item 9 do escopo de Revisões). Classifica
     um erro a partir do seu próprio histórico real de tentativas — nunca
     decide "domínio" com uma única questão. Retorna uma das chaves de
     CONFIG.CLASSIFICACAO_ERRO. --------------------------------------------- */
  classifyErrorDifficulty(entry){
    const tentativas = entry.tentativas || [];
    const qtdErros = entry.quantidadeErros || 1;
    const qtdAcertos = entry.quantidadeAcertosPosteriores || 0;
    const ultima = tentativas[tentativas.length-1];
    if(qtdErros >= 3) return "dificuldade_recorrente";
    if(qtdAcertos > 0 && ultima && !ultima.correta) return "baixa_retencao"; // acertou antes, errou de novo
    if(qtdAcertos >= 3 && (!ultima || ultima.correta)) return "dominio";
    return "erro_isolado";
  },

  // "Onde estou errando mais?" — agrupa erros reais por matéria/tema/subtema,
  // somando a quantidade de erros (não apenas a contagem de entradas).
  calcErrosPorConteudo(errorEntries){
    const porConteudo = {};
    (errorEntries||[]).forEach(e => {
      const k = (e.subjectId||"-")+"|"+(e.temaId||"-")+"|"+(e.subtemaId||"-");
      if(!porConteudo[k]) porConteudo[k] = { subjectId:e.subjectId||null, temaId:e.temaId||null, subtemaId:e.subtemaId||null, totalErros:0, entradas:0 };
      porConteudo[k].totalErros += (e.quantidadeErros||1);
      porConteudo[k].entradas += 1;
    });
    return Object.values(porConteudo).sort((a,b)=>b.totalErros-a.totalErros);
  },

  /* ------------------------------------------------------------------------
     ESTRUTURAL — prioridade de revisão (item 2 do escopo de Revisões). Combina
     atraso, erro recente, baixo percentual e estado — nunca decide sozinha
     que algo está "dominado" sem os dados já refletidos no estado recebido. */
  calcRevisaoPriority({ atrasoDias = 0, estado = "novo", erroRecente = false, percentualQuestoes = null }){
    let score = atrasoDias * 10;
    if(erroRecente) score += 50;
    if(percentualQuestoes != null && percentualQuestoes < 50) score += 30;
    if(estado === "baixa_retencao") score += 40;
    if(estado === "precisa_reforco") score += 20;
    if(estado === "dominado") score -= 100;
    return score;
  }
};

/* ==========================================================================
   CAMADA DE SERVIÇO DE IA — arquitetura real e configurável
   --------------------------------------------------------------------------
   REGRA DE SEGURANÇA INEGOCIÁVEL: esta camada NUNCA aceita nem envia uma
   chave secreta de provedor de IA (OpenAI/Anthropic/Google/etc.) a partir do
   navegador. O único ponto de configuração é a URL de um ENDPOINT/BACKEND
   que a própria usuária controla e que guarda a chave do lado do servidor —
   o navegador só conversa com esse endpoint, nunca diretamente com o
   provedor de IA. Isso é o "backend seguro" — não uma simulação.

   Sem endpoint configurado, toda chamada retorna, de forma honesta, que a
   IA não está conectada — nunca fabrica uma resposta. Com endpoint
   configurado, a chamada é uma requisição HTTP real (fetch), com validação
   da resposta antes de qualquer exibição.

   Formato esperado do endpoint (POST, JSON):
   Envia:  { tipo, systemPrompt, contexto }
   Espera: { texto: "..." }  — resposta explicativa em texto, OU
           { perguntas: [{ pergunta, respostaEsperada }] } ou
           { questoes: [{ enunciado, respostaCorreta, explicacao, dificuldade }] }
   Qualquer resposta fora desse formato é tratada como erro de validação,
   não é exibida como se fosse uma resposta válida.
   ========================================================================== */
const AI_SYSTEM_PROMPT = "Você é um tutor especializado em preparação para concursos públicos. Seu objetivo não é apenas fornecer a resposta. Seu objetivo é verificar se o estudante compreendeu o conceito. Use o contexto fornecido. Explique de maneira objetiva. Quando o estudante demonstrar dificuldade, mude a estratégia de explicação (não repita o mesmo texto). Nunca invente uma fonte. Nunca apresente uma questão gerada por IA como questão oficial. Quando criar questões de prática, utilize exclusivamente o formato CERTO/ERRADO. Se não houver informação suficiente para afirmar algo, deixe isso claro.";
const AI_ENDPOINT_STORAGE_KEY = "inss_ai_endpoint"; // guarda só a URL do backend da usuária — nunca uma chave

const AIService = (function(){
  let endpoint = null;
  try{ endpoint = localStorage.getItem(AI_ENDPOINT_STORAGE_KEY) || null; }
  catch(e){ /* localStorage indisponível — segue sem endpoint configurado */ }

  function respostaInvalida(tipo, contexto, detalhe){
    return { ok:false, configurado:true, tipo, motivo:"O endpoint respondeu, mas em um formato inesperado ("+detalhe+"). Nenhuma resposta é exibida quando a validação falha.", contextoEnviado: contexto };
  }
  function naoConfigurado(tipo, contexto){
    return Promise.resolve({
      ok:false, configurado:false, tipo,
      motivo:"Nenhum endpoint de IA está configurado nesta versão. Configure em Configurações → IA a URL de um backend seguro que você controla (nunca uma chave de API). Enquanto não houver, nada é fabricado.",
      contextoEnviado: contexto
    });
  }
  function chamar(tipo, contexto){
    if(!endpoint) return naoConfigurado(tipo, contexto);
    return fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo, systemPrompt: AI_SYSTEM_PROMPT, contexto })
    }).then(res => {
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }).then(data => {
      if(!data || typeof data !== "object") return respostaInvalida(tipo, contexto, "corpo da resposta não é um objeto JSON");
      if(tipo==="teste_compreensao" || tipo==="questoes_ia"){
        if(!Array.isArray(data.perguntas) && !Array.isArray(data.questoes)) return respostaInvalida(tipo, contexto, "esperava 'perguntas' ou 'questoes' em formato de lista");
      } else {
        if(typeof data.texto !== "string" || !data.texto.trim()) return respostaInvalida(tipo, contexto, "esperava um campo 'texto' com a explicação");
      }
      return { ok:true, configurado:true, tipo, resposta:data, contextoEnviado: contexto };
    }).catch(err => ({
      ok:false, configurado:true, tipo,
      motivo:"A chamada ao endpoint configurado falhou: "+err.message+". Nenhuma resposta é fabricada quando a chamada real falha.",
      contextoEnviado: contexto
    }));
  }
  return {
    isConfigured: () => !!endpoint,
    getEndpoint: () => endpoint,
    // Configura (ou remove, se url for vazio) o endpoint do backend seguro da usuária.
    // Nunca aceita nem armazena uma chave de provedor — só a URL do backend.
    configure(url){
      endpoint = url ? url.trim() : null;
      try{
        if(endpoint) localStorage.setItem(AI_ENDPOINT_STORAGE_KEY, endpoint);
        else localStorage.removeItem(AI_ENDPOINT_STORAGE_KEY);
      }catch(e){ /* ignora falha de armazenamento — configuração fica só em memória nesta sessão */ }
    },
    solicitarExplicacao: (contexto) => chamar("explicacao", contexto),
    solicitarReforco: (contexto) => chamar("reforco", contexto),
    solicitarTesteCompreensao: (contexto) => chamar("teste_compreensao", contexto),
    solicitarQuestoesPratica: (contexto) => chamar("questoes_ia", contexto),
    solicitarRespostaChat: (contexto) => chamar("chat", contexto)
  };
})();

// Monta o contexto MÍNIMO necessário para enviar à IA (usa o máximo de contexto
// relevante, mas nunca dados pessoais desnecessários). pedirNovaAbordagem: usado
// quando a usuária já disse que não entendeu — instrui a IA a variar a estratégia.
function montarContextoDuvidaIA({ duvida, fontes, mensagens, questao, materiaNome, temaNome, subtemaNome, pedirNovaAbordagem }){
  return {
    materia: materiaNome || null, tema: temaNome || null, subtema: subtemaNome || null,
    titulo: duvida.titulo, pergunta: duvida.pergunta, contexto: duvida.contexto || null,
    origemDaDuvida: duvida.origem || null,
    questao: questao ? { enunciado: questao.enunciado, respostaCorreta: questao.respostaCorreta, explicacaoCadastrada: questao.explicacao || null } : null,
    respostaDoUsuarioNaQuestao: duvida.respostaUsuarioQuestao || null,
    motivoDoErroOriginal: duvida.motivoErroOrigem || null,
    fontesConsultadas: (fontes||[]).map(f => ({ tipo:f.tipo, conteudo:f.conteudo||null, origem:"Fonte fornecida pelo usuário." })),
    tentativasDeExplicacaoAnteriores: (duvida.historicoExplicacoes||[]).length,
    reforcosAnteriores: (duvida.historicoReforcos||[]).length,
    historicoDaConversa: (mensagens||[]).map(m => ({ autor: m.tipo, texto: m.texto })),
    instrucaoDeAbordagem: pedirNovaAbordagem
      ? "A usuária já recebeu "+((duvida.historicoExplicacoes||[]).length)+" explicação(ões) anterior(es) e ainda não entendeu. NÃO repita a mesma explicação — use uma abordagem diferente (exemplo prático, comparação, passo a passo, analogia, ou uma pergunta para identificar onde exatamente está a dificuldade)."
      : null
  };
}
function renderContextoIA(contexto){
  return '<details class="mt8"><summary class="hint" style="cursor:pointer;">Ver contexto que seria enviado à IA</summary><pre style="font-size:11px;white-space:pre-wrap;background:var(--surface-alt);padding:10px;border-radius:var(--radius-sm);margin-top:6px;">'+esc(JSON.stringify(contexto, null, 2))+'</pre></details>';
}

function ic(name, size){
  size = size || 16;
  return '<svg class="ic-svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICON_PATHS[name]||"")+'</svg>';
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtMin(min){
  if(min==null) return "—";
  const h = Math.floor(min/60), m = min%60;
  if(h && m) return h+"h"+String(m).padStart(2,"0");
  if(h) return h+"h";
  return m+"min";
}
function fmtDateBR(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return d+"/"+m;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function ringSVG(pct, size, stroke, colorVar){
  size = size||64; stroke = stroke||7;
  pct = Math.max(0, Math.min(100, Math.round(pct||0)));
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c-(pct/100)*c;
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px;">'
    + '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--surface-alt)" stroke-width="'+stroke+'"/>'
    + '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+(colorVar||'var(--primary)')+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="transition:stroke-dashoffset .5s ease;"/>'
    + '</svg><span class="ring-val" style="font-size:'+(size*0.22)+'px;">'+pct+'%</span></div>';
}
function badgeStatus(status){
  const map = { "Pendente":"gray", "Revisado":"blue", "Superado":"green", "planejado":"gray", "iniciado":"blue", "concluido":"green", "perdido":"red", "reagendado":"gold", "cancelado":"gray" };
  const label = CONFIG.ROTULO_STATUS_PLANO[status] || status;
  return '<span class="badge '+(map[status]||"gray")+'">'+esc(label)+'</span>';
}

/* ==========================================================================
   CACHE DE ESTRUTURA ACADÊMICA (usada nos formulários / selects)
   ========================================================================== */
function loadStructureCache(){
  return Promise.all([
    DataStore.listSubjects(), DataStore.listParts(), DataStore.listTemas(), DataStore.listSubtemas()
  ]).then(([subjects, parts, temas, subtemas]) => {
    STATE.cache.subjects = subjects; STATE.cache.parts = parts; STATE.cache.temas = temas; STATE.cache.subtemas = subtemas;
  });
}
function partsOf(subjectId){ return STATE.cache.parts.filter(p=>p.subjectId===subjectId); }
function temasOf(partId){ return STATE.cache.temas.filter(t=>t.partId===partId); }
// Temas ligados diretamente à matéria, sem uma "parte" intermediária — usados quando
// a fonte curricular não tem divisão em partes (ver DataStore.importCurriculum).
function temasDiretoOf(subjectId){ return STATE.cache.temas.filter(t=>!t.partId && t.subjectId===subjectId); }
function subtemasOf(temaId){ return STATE.cache.subtemas.filter(s=>s.temaId===temaId); }
function nameOf(list, id){ const it = list.find(x=>x.id===id); return it ? it.nome : "—"; }

// Bloco de selects em cascata Matéria → Parte → Tema → Subtema, reutilizado em vários
// formulários. Quando uma matéria não tem nenhuma parte cadastrada, o nível "Parte"
// fica desabilitado e o select de Tema é preenchido diretamente a partir da matéria.
function cascadeSelectsHTML(prefix, sel){
  sel = sel || {};
  const subjOpts = STATE.cache.subjects.map(s=>'<option value="'+s.id+'" '+(sel.subjectId===s.id?"selected":"")+'>'+esc(s.nome)+'</option>').join("");
  const temSemParte = sel.subjectId && partsOf(sel.subjectId).length===0;
  const partOpts = partsOf(sel.subjectId).map(p=>'<option value="'+p.id+'" '+(sel.partId===p.id?"selected":"")+'>'+esc(p.nome)+'</option>').join("");
  const temaOpts = temSemParte
    ? temasDiretoOf(sel.subjectId).map(t=>'<option value="'+t.id+'" '+(sel.temaId===t.id?"selected":"")+'>'+esc(t.nome)+'</option>').join("")
    : temasOf(sel.partId).map(t=>'<option value="'+t.id+'" '+(sel.temaId===t.id?"selected":"")+'>'+esc(t.nome)+'</option>').join("");
  const subOpts = subtemasOf(sel.temaId).map(s=>'<option value="'+s.id+'" '+(sel.subtemaId===s.id?"selected":"")+'>'+esc(s.nome)+'</option>').join("");
  return ''
  + '<div class="field"><label>Matéria</label><select name="subjectId" data-action="cascadeChange" data-scope="'+prefix+'" data-level="subject">'+ (subjOpts||'<option value="">Cadastre uma matéria em Configurações</option>') +'</select></div>'
  + '<div class="field"><label>Parte / Bloco'+(temSemParte?' (esta matéria não tem partes)':'')+'</label><select name="partId" '+(temSemParte?"disabled":"")+' data-action="cascadeChange" data-scope="'+prefix+'" data-level="part">'+(partOpts||'<option value="">—</option>')+'</select></div>'
  + '<div class="field"><label>Tema</label><select name="temaId" data-action="cascadeChange" data-scope="'+prefix+'" data-level="tema">'+(temaOpts||'<option value="">—</option>')+'</select></div>'
  + '<div class="field"><label>Subtema</label><select name="subtemaId">'+(subOpts||'<option value="">—</option>')+'</select></div>';
}
Actions.cascadeChange = function(el){
  const form = el.closest("form");
  if(!form) return;
  const level = el.dataset.level;
  if(level==="subject"){
    const subjectId = form.querySelector('[name="subjectId"]').value;
    const parts = partsOf(subjectId);
    const partSelect = form.querySelector('[name="partId"]');
    form.querySelector('[name="temaId"]').innerHTML = '<option value="">—</option>';
    form.querySelector('[name="subtemaId"]').innerHTML = '<option value="">—</option>';
    if(parts.length){
      partSelect.disabled = false;
      partSelect.innerHTML = parts.map(p=>'<option value="'+p.id+'">'+esc(p.nome)+'</option>').join("");
      Actions.cascadeChange(partSelect);
    } else {
      partSelect.disabled = true;
      partSelect.innerHTML = '<option value="">—</option>';
      const temasDireto = temasDiretoOf(subjectId);
      form.querySelector('[name="temaId"]').innerHTML = temasDireto.map(t=>'<option value="'+t.id+'">'+esc(t.nome)+'</option>').join("") || '<option value="">—</option>';
      if(temasDireto[0]) Actions.cascadeChange(form.querySelector('[name="temaId"]'));
    }
  } else if(level==="part"){
    const partId = form.querySelector('[name="partId"]').value;
    const temas = temasOf(partId);
    form.querySelector('[name="temaId"]').innerHTML = temas.map(t=>'<option value="'+t.id+'">'+esc(t.nome)+'</option>').join("") || '<option value="">—</option>';
    form.querySelector('[name="subtemaId"]').innerHTML = '<option value="">—</option>';
    if(temas[0]) Actions.cascadeChange(form.querySelector('[name="temaId"]'));
  } else if(level==="tema"){
    const temaId = form.querySelector('[name="temaId"]').value;
    const subs = subtemasOf(temaId);
    form.querySelector('[name="subtemaId"]').innerHTML = subs.map(s=>'<option value="'+s.id+'">'+esc(s.nome)+'</option>').join("") || '<option value="">—</option>';
  }
};
